# nats-server config for the local test infrastructure
# (docker-compose.test.yml) and any self-hosted deployment of
# internal/transport/nats. jetstream must be enabled -- both the job
# queue and event stream need it; only cancel signals use plain core
# NATS pub/sub, which needs nothing special.
#
# max_payload: nats-server's own default (1MB) is smaller than this
# project's own large-payload conformance test (a 1MB job Input plus
# JSON framing overhead, confirmed live to exceed the default and get
# rejected with "maximum payload exceeded"). There is no CLI flag
# for this -- it's config-file-only -- which is the whole reason this
# file exists rather than passing flags directly to the nats-server
# binary the way docker-compose.test.yml's other services do.
jetstream: true
max_payload: 8MB

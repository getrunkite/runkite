# Minimal in-cluster Postgres + Redis for kind Helm smoke.
# Not HA — enough for install proof; chart still expects bring-your-own data plane.
apiVersion: v1
kind: Namespace
metadata:
  name: runkite-smoke
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: runkite-smoke
type: Opaque
stringData:
  POSTGRES_USER: runkite
  POSTGRES_PASSWORD: runkite
  POSTGRES_DB: runkite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: runkite-smoke
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgres-auth
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "runkite", "-d", "runkite"]
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "runkite", "-d", "runkite"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: runkite-smoke
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: runkite-smoke
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: runkite-smoke
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis

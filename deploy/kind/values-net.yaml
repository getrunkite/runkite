# Kind K3 overlay — HTTP Ingress + NetworkPolicy (MCP Ingress off, no TLS).
# Use with values.yaml + values-supported.yaml.

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: runkite.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressMcp:
  enabled: false

networkPolicy:
  enabled: true
  ingressFrom: []

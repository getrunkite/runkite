# Supported / announce profile overlay.
#
# Pins the same Postgres + Redis multi-replica shape exercised by
# docker-compose.multi.yml and make soak-multi. This chart does NOT
# install Postgres or Redis — point secrets at infrastructure you run.
#
# Install:
#   helm upgrade --install runkite ./deploy/helm/runkite \
#     -f deploy/helm/runkite/values.yaml \
#     -f deploy/helm/runkite/values-supported.yaml \
#     --set secrets.existingSecret=runkite-creds
#
# Required Secret keys (existingSecret or inline secrets.*):
#   POSTGRES_DSN
#   REDIS_URL
#   RUNNER_TOKEN                 # runner Deployment
#   RUNNER_TOKEN_PYTHON_LANGGRAPH  # control plane (may equal RUNNER_TOKEN)
#   RUNNER_TENANTS_PYTHON_LANGGRAPH  # required with client auth; use default for single-tenant
#   RUNKITE_API_KEY              # default langgraphJson api_key auth
#
# Compose multi/soak is the Supported correctness proof path. This overlay
# packages the same topology for Kubernetes. Kind K0–K3 ops proofs exist
# (make kind-helm-all; docs/k8s-kind-proof.md). Named EKS smoke/reclaim
# (K4) is done (docs/k8s-eks-soak-results.md); full multi-AZ HA soak still open.
#
# Optional pod TLS: also -f values-tls.yaml (and supply TLS Secrets).

replicaCount: 2

autoscaling:
  enabled: false

tls:
  enabled: false

runner:
  enabled: true

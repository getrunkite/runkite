{{- if .Values.networkPolicy.egress.enabled }}
{{- if and .Values.runner.enabled (not .Values.runner.proxyOnly) }}
{{- fail "networkPolicy.egress.enabled requires runner.proxyOnly to avoid distributing database credentials" }}
{{- end }}
{{- if not .Values.networkPolicy.egress.controlPlaneRules }}
{{- fail "networkPolicy.egress.enabled requires explicit controlPlaneRules for the configured infrastructure" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runkite.fullname" . }}-egress
spec:
  podSelector:
    matchLabels:
      {{- include "runkite.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.podSelector | nindent 12 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- toYaml .Values.networkPolicy.egress.controlPlaneRules | nindent 4 }}
{{- if .Values.runner.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runkite.fullname" . }}-runner-egress
spec:
  podSelector:
    matchLabels:
      {{- include "runkite.runner.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.podSelector | nindent 12 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              {{- include "runkite.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ int .Values.config.httpPort }}}
        - {protocol: TCP, port: {{ int .Values.config.grpcPort }}}
    {{- with .Values.networkPolicy.egress.runnerRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}

{{- include "runkite.tls.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runkite.fullname" . }}
  labels:
    {{- include "runkite.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "runkite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "runkite.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "runkite.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: runkite
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ int .Values.config.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ int .Values.config.grpcPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "runkite.fullname" . }}
            - secretRef:
                name: {{ include "runkite.secretName" . }}
          {{- if .Values.tls.enabled }}
          env:
            {{- if .Values.tls.http.enabled }}
            - name: TLS_CERT_FILE
              value: {{ include "runkite.tls.serverDir" . }}/tls.crt
            - name: TLS_KEY_FILE
              value: {{ include "runkite.tls.serverDir" . }}/tls.key
            {{- if .Values.tls.http.mtls }}
            - name: TLS_CLIENT_CA_FILE
              value: {{ include "runkite.tls.caDir" . }}/ca.crt
            {{- end }}
            {{- end }}
            {{- if .Values.tls.grpc.enabled }}
            - name: GRPC_TLS_CERT_FILE
              value: {{ include "runkite.tls.serverDir" . }}/tls.crt
            - name: GRPC_TLS_KEY_FILE
              value: {{ include "runkite.tls.serverDir" . }}/tls.key
            {{- if .Values.tls.grpc.mtls }}
            - name: GRPC_TLS_CLIENT_CA_FILE
              value: {{ include "runkite.tls.caDir" . }}/ca.crt
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if or .Values.config.langgraphJson .Values.tls.enabled }}
          volumeMounts:
            {{- if .Values.config.langgraphJson }}
            - name: langgraph-config
              mountPath: /etc/runkite
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls-server
              mountPath: {{ include "runkite.tls.serverDir" . }}
              readOnly: true
            - name: tls-ca
              mountPath: {{ include "runkite.tls.caDir" . }}
              readOnly: true
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
              {{- if and .Values.tls.enabled .Values.tls.http.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
              {{- if and .Values.tls.enabled .Values.tls.http.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              {{- if and .Values.tls.enabled .Values.tls.http.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.config.langgraphJson .Values.tls.enabled }}
      volumes:
        {{- if .Values.config.langgraphJson }}
        - name: langgraph-config
          configMap:
            name: {{ include "runkite.fullname" . }}-langgraph
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls-server
          secret:
            secretName: {{ .Values.tls.serverSecretName | quote }}
        - name: tls-ca
          secret:
            secretName: {{ .Values.tls.caSecretName | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runkite.fullname" . }}
  labels:
    {{- include "runkite.labels" . | nindent 4 }}
data:
  HTTP_PORT: {{ .Values.config.httpPort | quote }}
  GRPC_PORT: {{ .Values.config.grpcPort | quote }}
  LANGGRAPH_CONFIG: {{ .Values.config.langgraphConfig | quote }}
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}

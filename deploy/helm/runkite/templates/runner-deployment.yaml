{{- if .Values.runner.enabled }}
{{- include "runkite.tls.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runkite.fullname" . }}-runner
  labels:
    {{- include "runkite.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: {{ .Values.runner.replicaCount }}
  selector:
    matchLabels:
      {{- include "runkite.runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "runkite.runner.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "runkite.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: runner
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.runner.image.repository }}:{{ .Values.runner.image.tag }}"
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          env:
            - name: RUNKITE_GRPC_URL
              value: "{{ include "runkite.fullname" . }}:{{ .Values.service.grpcPort }}"
            - name: RUNKITE_HTTP_URL
              value: "{{ include "runkite.httpScheme" . }}://{{ include "runkite.fullname" . }}:{{ .Values.service.httpPort }}"
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "runkite.secretName" . }}
                  key: RUNNER_TOKEN
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "runkite.secretName" . }}
                  key: POSTGRES_DSN
            {{- if .Values.tls.enabled }}
            - name: RUNKITE_TLS_CA_FILE
              value: {{ include "runkite.tls.caDir" . }}/ca.crt
            {{- if or .Values.tls.http.mtls .Values.tls.grpc.mtls }}
            - name: RUNKITE_TLS_CLIENT_CERT_FILE
              value: {{ include "runkite.tls.clientDir" . }}/tls.crt
            - name: RUNKITE_TLS_CLIENT_KEY_FILE
              value: {{ include "runkite.tls.clientDir" . }}/tls.key
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.runner.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls-ca
              mountPath: {{ include "runkite.tls.caDir" . }}
              readOnly: true
            {{- if or .Values.tls.http.mtls .Values.tls.grpc.mtls }}
            - name: tls-client
              mountPath: {{ include "runkite.tls.clientDir" . }}
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls-ca
          secret:
            secretName: {{ .Values.tls.caSecretName | quote }}
        {{- if or .Values.tls.http.mtls .Values.tls.grpc.mtls }}
        - name: tls-client
          secret:
            secretName: {{ .Values.tls.clientSecretName | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

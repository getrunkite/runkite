{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "runkite.fullname" . }}
  labels:
    {{- include "runkite.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ required "secrets.postgresDsn (or secrets.existingSecret) is required" .Values.secrets.postgresDsn | quote }}
  REDIS_URL: {{ required "secrets.redisUrl (or secrets.existingSecret) is required" .Values.secrets.redisUrl | quote }}
  RUNNER_TOKEN_PYTHON_LANGGRAPH: {{ required "secrets.runnerToken (or secrets.existingSecret) is required" .Values.secrets.runnerToken | quote }}
  # Runner pods read RUNNER_TOKEN; same value as the control-plane key above.
  RUNNER_TOKEN: {{ .Values.secrets.runnerToken | quote }}
  # Consumed by the default langgraphJson via ${RUNKITE_API_KEY} at config
  # load time -- without this, serve fails admission ("no client-facing
  # auth") or expandEnvVars errors on the unset placeholder.
  RUNKITE_API_KEY: {{ required "secrets.apiKey (or secrets.existingSecret with RUNKITE_API_KEY) is required for the default langgraphJson auth" .Values.secrets.apiKey | quote }}
{{- end }}

{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "runkite.fullname" . }}
  labels:
    {{- include "runkite.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ required "secrets.postgresDsn (or secrets.existingSecret) is required" .Values.secrets.postgresDsn | quote }}
  REDIS_URL: {{ required "secrets.redisUrl (or secrets.existingSecret) is required" .Values.secrets.redisUrl | quote }}
  {{- $cpRunnerToken := .Values.secrets.runnerToken }}
  {{- if .Values.secrets.runnerTokenAllowlist }}
  {{- $cpRunnerToken = .Values.secrets.runnerTokenAllowlist }}
  {{- end }}
  RUNNER_TOKEN_PYTHON_LANGGRAPH: {{ required "secrets.runnerToken (or secrets.existingSecret) is required" $cpRunnerToken | quote }}
  # Required whenever client auth + runner tokens are on (stock langgraphJson
  # includes auth). default = single-tenant; override via existingSecret or
  # secrets.runnerTenants for multi-tenant allow-lists.
  RUNNER_TENANTS_PYTHON_LANGGRAPH: {{ default "default" .Values.secrets.runnerTenants | quote }}
  # Runner pods present a single RUNNER_TOKEN (this chart's fleet).
  # CP may accept a comma-separated allowlist via runnerTokenAllowlist.
  RUNNER_TOKEN: {{ required "secrets.runnerToken (or secrets.existingSecret) is required" .Values.secrets.runnerToken | quote }}
  # Consumed by the default langgraphJson via ${RUNKITE_API_KEY} at config
  # load time -- without this, serve fails admission ("no client-facing
  # auth") or expandEnvVars errors on the unset placeholder.
  RUNKITE_API_KEY: {{ required "secrets.apiKey (or secrets.existingSecret with RUNKITE_API_KEY) is required for the default langgraphJson auth" .Values.secrets.apiKey | quote }}
{{- end }}

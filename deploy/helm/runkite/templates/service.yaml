apiVersion: v1
kind: Service
metadata:
  name: {{ include "runkite.fullname" . }}
  labels:
    {{- include "runkite.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      appProtocol: http
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      # Cleartext gRPC is HTTP/2 without TLS; "grpc" is not a K8s
      # well-known appProtocol value.
      appProtocol: kubernetes.io/h2c
  selector:
    {{- include "runkite.selectorLabels" . | nindent 4 }}

# Minimal production-shaped defaults. Postgres + Redis are NOT bundled --
# point postgresDsn / redisUrl (or an existingSecret) at infrastructure you
# already run. Multi-replica requires Redis (shared queue/broker/cancel/
# rate-limits); in-process transport is single-replica only.

replicaCount: 2

image:
  # Published on release tags: ghcr.io/getrunkite/runkite:<version>
  # Default follows :latest from the Release workflow; pin tag for prod.
  repository: ghcr.io/getrunkite/runkite
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false

# Longer than the control plane's own 15s drain budget so kubelet does
# not SIGKILL mid-graceful-shutdown (see docker-compose.multi.yml).
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  httpPort: 2026
  grpcPort: 50051

# Optional HTTP Ingress. /mcp needs sticky routing (session state is
# in-process) -- use a dedicated Ingress with upstream-hash-by=$remote_addr
# (ingress-nginx) rather than round-robin. See ingressMcp below.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: runkite.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Separate Ingress for /mcp with client-IP consistent hashing. Disable
# when your external LB already sticks /mcp the same way deploy/nginx-multi.conf
# does (hash $remote_addr consistent).
ingressMcp:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
  hosts:
    - host: runkite.local
      paths:
        - path: /mcp
          pathType: Prefix
  tls: []

# Production-shaped defaults; override per environment. HPA needs
# requests.cpu when autoscaling.enabled=true.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  # Requires resources.requests.cpu (and usually memory) on the control-
  # plane container; enabling with resources: {} creates an HPA that
  # never scales.
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  # Keep at least one control-plane pod during voluntary disruptions when
  # replicaCount >= 2. Ignored when replicaCount is 1.
  minAvailable: 1

# Opt-in ingress lockdown. Off by default -- many clusters lack a
# NetworkPolicy-capable CNI, and default-deny egress would break
# OAuth/connectors/webhooks/OTLP without careful allow-lists.
networkPolicy:
  enabled: false
  # Optional additional from: rules for the control-plane policy
  # (namespaceSelector / podSelector). Empty = allow ingress from any
  # peer in the cluster on HTTP/gRPC ports.
  ingressFrom: []

nodeSelector: {}
tolerations: []
affinity: {}

# Non-secret control-plane settings (ConfigMap).
config:
  httpPort: "2026"
  grpcPort: "50051"
  # Path passed as LANGGRAPH_CONFIG. When langgraphJson below is non-empty
  # (the default), the chart mounts that file here. When langgraphJson is
  # "", this path is expected to already exist inside the image and MUST
  # include an "auth" section -- otherwise `serve` refuses to start
  # (production admission check).
  langgraphConfig: /etc/runkite/langgraph.json
  # Inline langgraph.json mounted into every control-plane pod. Uses
  # ${RUNKITE_API_KEY} so the credential lives in the Secret, not in this
  # ConfigMap (see internal/config expandEnvVars). Override with your
  # real graphs; set to "" only if the image already bakes a config with
  # auth at config.langgraphConfig.
  langgraphJson: |
    {
      "graphs": {
        "echo_agent": "/app/examples/echo_agent/graph.py:graph"
      },
      "dependencies": [
        "/app/examples/echo_agent"
      ],
      "auth": {
        "type": "api_key",
        "strict_permissions": true,
        "keys": {
          "${RUNKITE_API_KEY}": {
            "name": "operator",
            "permissions": ["read", "write", "admin"],
            "tenant_id": "default"
          }
        }
      }
    }
  # Extra plain env vars (string map). Prefer secrets for credentials.
  # Do not set RUNKITE_ALLOW_INSECURE_SERVE here for production -- supply
  # auth via langgraphJson (or a baked image) instead.
  extraEnv: {}

# Secret material. Prefer existingSecret in real deployments; the inline
# fields exist so `helm install --set` smoke tests stay one-shot.
secrets:
  # Name of an existing Secret whose keys include POSTGRES_DSN, REDIS_URL,
  # RUNNER_TOKEN_PYTHON_LANGGRAPH, RUNNER_TOKEN, and (when using the
  # default langgraphJson) RUNKITE_API_KEY. When set, the chart does not
  # create its own Secret.
  existingSecret: ""
  postgresDsn: ""
  redisUrl: ""
  # Presented by this chart's runner Deployment as RUNNER_TOKEN.
  # Control plane gets RUNNER_TOKEN_PYTHON_LANGGRAPH = runnerTokenAllowlist
  # when that is set, otherwise the same value as runnerToken.
  runnerToken: ""
  # Optional comma-separated allowlist for the control plane only
  # (fleet rotation / multi-fleet). When empty, CP uses runnerToken.
  # Runner pods still receive only secrets.runnerToken (one secret).
  # See chart README "Runner token allowlist".
  runnerTokenAllowlist: ""
  # Substituted into the default langgraphJson as ${RUNKITE_API_KEY}.
  # Required for the stock quick-start; unused if your langgraphJson
  # does not reference that env var.
  apiKey: ""

# Pod-level TLS / mTLS for control-plane ↔ runner (and client HTTPS).
# Off by default. Reuses the env contract in docs/auth.md — the chart only
# mounts Secrets and sets those vars. Does NOT generate certificates;
# supply kubernetes.io/tls (server/client) + Opaque CA (ca.crt) Secrets yourself
# (cert-manager, openssl, etc.). Server cert SAN must include the Service
# DNS name runners use (Release fullname / FQDN).
#
# Recommended when enabled: HTTP TLS + gRPC TLS + gRPC mTLS; leave
# http.mtls false so kubelet httpGet probes keep working (HTTP mTLS would
# require a client cert on /livez+/readyz, which httpGet cannot present).
tls:
  enabled: false
  serverSecretName: "" # kubernetes.io/tls: tls.crt + tls.key (CP server cert)
  caSecretName: ""     # Opaque (or similar): ca.crt
  clientSecretName: "" # kubernetes.io/tls: tls.crt + tls.key (runner client cert; required when any *.mtls)
  mountPath: /etc/runkite/tls
  http:
    enabled: true  # TLS_CERT_FILE / TLS_KEY_FILE; probes use scheme HTTPS
    mtls: false    # TLS_CLIENT_CA_FILE — keep false unless you override probes
  grpc:
    enabled: true  # GRPC_TLS_CERT_FILE / GRPC_TLS_KEY_FILE
    mtls: true     # GRPC_TLS_CLIENT_CA_FILE (recommended when tls.enabled)

# Optional Python runner Deployment (Dockerfile.runner). Talks to the
# control-plane Service over cluster DNS for gRPC + HTTP.
runner:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/getrunkite/runkite-runner
    tag: latest
    pullPolicy: IfNotPresent
  resources: {}
  # Extra env for the runner pod (e.g. an LLM API key via valueFrom).
  extraEnv: {}

# Cheap EKS cluster for K4 soak (budget-capped).
#
# Free Tier accounts reject non-eligible types (t3.medium failed with
# InvalidParameterCombination). Use free-tier-eligible types only.
# Prefer m7i-flex.large (2 vCPU / 8 GiB) so CP×2 + runner + in-cluster
# Postgres/Redis fit; t3.small is too tight.
#
# Create:  make eks-up
# Delete:  make eks-down
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: runkite-k4
  region: eu-north-1
  version: "1.31"
  tags:
    project: runkite
    purpose: k4-soak
    keep: "false"

# Keep classic managed nodegroups (not Auto Mode).
autoModeConfig:
  enabled: false

vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: false

iam:
  withOIDC: true

managedNodeGroups:
  - name: ng
    instanceType: m7i-flex.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 40
    privateNetworking: false
    disableIMDSv1: true
    labels:
      role: soak
    tags:
      purpose: k4-soak

name: runkite-specialist-caller
display_name: Runkite specialist caller
description: Delegate one specialist operation to an existing Runkite managed agent over MCP.
version: "1.0.0"
author: Runkite contributors

runtime:
  type: claude-code

credentials:
  mcp_servers:
    runkite-specialist:
      env_vars:
        - RUNKITE_API_KEY

credential_setup:
  - name: RUNKITE_API_KEY
    title: Dedicated Runkite tenant API key
    description: A server-side key with read and write permissions for the specialist tenant.
    required: true
    secret: true
    format: secret

capabilities:
  - runkite-specialist-delegation

mcp_servers:
  - name: runkite-specialist
    description: Invoke one operator-selected Runkite specialist with a saved operation and conversation ID.

use_cases:
  - Delegate a specialist task using the caller's persisted operation ID.
  - Observe the same retained operation after a lost response.
  - Continue a specialist conversation using a new operation ID on the same thread.

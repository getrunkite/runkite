# Override for a 30-minute laptop soak against docker-compose.multi.yml.
# Usage:
#   RUNNER_TOKEN=... docker compose -f docker-compose.multi.yml -f docker-compose.soak.yml up -d
#
# Adds: soak agent set (echo/slow/llm_sim/store), webhooks to host:9099,
# pprof on CPs, LLM_SIM_DELAY_MS on runners, bind-mounted examples.
name: runkite-multi

services:
  runkite-1: &soak-cp
    environment:
      LANGGRAPH_CONFIG: /app/examples/soak_multi/langgraph.json
      RUNKITE_PPROF: "1"
      # Required alongside RUNKITE_PPROF=1 -- anonymous pprof is refused.
      RUNKITE_PPROF_TOKEN: "soak-pprof-local-only"
      RUNKITE_ALLOW_INSECURE_SERVE: "1"
    volumes:
      - ./examples:/app/examples:ro

  runkite-2:
    <<: *soak-cp

  runkite-3:
    <<: *soak-cp

  runner-1: &soak-runner
    environment:
      LLM_SIM_DELAY_MS: "400"
    volumes:
      - ./examples:/app/examples:ro
    command: ["--config", "/app/examples/soak_multi/langgraph.json"]

  runner-2:
    <<: *soak-runner

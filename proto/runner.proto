syntax = "proto3";

package runkite.runner.v0;

option go_package = "github.com/sharanharsoor/runkite/internal/bridge/runnerpb";

// RunnerService is the gRPC service that runners implement.
// The control plane connects to runners (long-poll style) or runners
// connect to the control plane -- either way, this is the contract.
service RunnerService {
  // GetJob blocks until a job is available for the runner.
  // Runner calls this in a loop (long-poll pattern).
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // StreamEvents is called by the runner to stream events back
  // to the control plane for a specific run.
  rpc StreamEvents(stream RunEventProto) returns (StreamEventsResponse);

  // ReportStatus reports the final status of a run.
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);

  // WatchCancels is a server-streaming RPC the runner calls to receive
  // cancel signals for runs it is executing. The runner sends its
  // runner_kind; the server streams CancelSignal messages whenever
  // a run of that kind is cancelled.
  rpc WatchCancels(WatchCancelsRequest) returns (stream CancelSignal);

  // Heartbeat is called periodically by the runner while a run is
  // actively executing, to prove liveness for the WHOLE run, not just
  // delivery. Without this, the control plane only knows a job is alive
  // up to its first StreamEvents message (~15ms after dequeue in
  // practice) -- a runner crash any time after that left the run
  // permanently stuck, confirmed live. The server extends the same
  // in-flight lease Dequeue creates (see transport.JobQueue's Renew)
  // each time this arrives; a runner that stops heartbeating (crashed,
  // or an older runner that doesn't send this RPC at all) eventually
  // falls stale and gets reclaimed by the existing ReclaimStale reaper
  // -- no new reclaim mechanism needed, just a mechanism to keep
  // resetting the clock during real work.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message GetJobRequest {
  string runner_kind = 1;
  int32 timeout_seconds = 2; // how long to wait for a job
}

message GetJobResponse {
  bool has_job = 1;
  string assignment_json = 2; // JSON-encoded RunAssignment
}

message RunEventProto {
  string run_id = 1;
  string event_json = 2; // JSON-encoded RunEvent
  // generation is the attempt number this runner was handed in its
  // RunAssignment (see internal/transport/types.go's RunAssignment.Generation
  // doc comment for the full fencing rationale) -- 0 from an older
  // runner build that predates fencing, treated the same as "always
  // matches" for backward compat (see server.go's Heartbeat/ReportStatus
  // handlers).
  int64 generation = 3;
}

message StreamEventsResponse {
  bool ok = 1;
}

message ReportStatusRequest {
  string run_id = 1;
  string status = 2; // "success", "error", "interrupted"
  string error_message = 3; // only if status == "error"
  int64 generation = 4; // see RunEventProto.generation
}

message ReportStatusResponse {
  bool ok = 1;
  // superseded is true when this report's generation was stale -- a
  // newer attempt (dispatched after this runner was reclaimed) already
  // owns the run, so the control plane ignored this report's status
  // entirely rather than risk overwriting the real outcome. The runner
  // has nothing further to do when this is true; it's informational
  // (log it), not something to retry.
  bool superseded = 2;
}

message WatchCancelsRequest {
  string runner_kind = 1;
}

message CancelSignal {
  string run_id = 1;
}

message HeartbeatRequest {
  string run_id = 1;
  int64 generation = 2; // see RunEventProto.generation
}

message HeartbeatResponse {
  bool ok = 1;
  // superseded is true when this run's generation is no longer current
  // -- a newer attempt has already been dispatched (this runner was
  // reclaimed while it was still, genuinely, executing). Unlike
  // ReportStatusResponse.superseded, this arrives WHILE the runner is
  // still mid-execution (heartbeats fire every ~2s throughout a run,
  // not just once at the end) -- the runner should treat this exactly
  // like a self-triggered cancel: stop executing its graph and report
  // "interrupted" rather than continuing to burn resources on a run
  // that's already being retried elsewhere. Catching this at the NEXT
  // heartbeat tick, rather than only once the runner eventually
  // finishes and calls ReportStatus, is what makes an old runner
  // actually detect its own lease loss and stop.
  bool superseded = 2;
}

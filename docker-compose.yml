# Full-stack Runkite deployment (production-like).
#
# Requires real secrets, on purpose: POSTGRES_PASSWORD and RUNNER_TOKEN
# have no built-in fallback, so `docker compose up` fails fast with a
# clear error instead of silently starting with a well-known default
# password or a "change-me-in-production" token that, historically,
# nobody actually changes. Copy .env.example to .env and fill in real
# values before running this file -- see .env.example's own comments.
#
# Usage:
#   cp .env.example .env   # then edit .env with real values
#   docker compose up -d --build
#   docker compose down -v
services:
  postgres:
    # pgvector/pgvector:pg16 is a drop-in postgres:16 image with the
    # pgvector extension binary available. Not enabled by default --
    # only matters if you also set "vector_store" in langgraph.json (see
    # README's Vector Store section), which runs its own
    # `CREATE EXTENSION IF NOT EXISTS vector`. A deployment that never
    # touches vector_store is completely unaffected by this image swap.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: runkite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env -- see .env.example}
      POSTGRES_DB: runkite
    # No host port published, deliberately -- only the runkite/runner
    # services on this compose's own network need to reach Postgres by
    # service name. Publishing 5432 to the host has no operational
    # benefit here and is one less thing exposed if the host itself is
    # reachable from outside. Use `docker compose exec postgres psql
    # -U runkite` for ad hoc access instead of a host port.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runkite -d runkite"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # No host port published -- same reasoning as postgres above.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  runkite:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "2026:2026"
      - "50051:50051"
    environment:
      POSTGRES_DSN: postgres://runkite:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env -- see .env.example}@postgres:5432/runkite?sslmode=disable
      REDIS_URL: redis://redis:6379
      HTTP_PORT: "2026"
      GRPC_PORT: "50051"
      LANGGRAPH_CONFIG: /app/examples/all_agents/langgraph.json
      # Runner auth (production mode): protects the gRPC bridge and
      # /internal/* routes so only runners with this token can dequeue
      # jobs, stream events, or fetch connector credentials. No
      # fallback default -- a shared, well-known "placeholder" token
      # that everyone forgets to change is worse than forcing a real
      # one up front.
      RUNNER_TOKEN_PYTHON_LANGGRAPH: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env -- see .env.example}
      # This stack demonstrates durable-backend + runner-auth wiring on
      # a local Docker network; it doesn't configure client-facing auth
      # (see langgraph.json's "auth" section) since that's a deployment
      # decision, not something to hardcode into an example compose
      # file. checkProductionAdmission (cmd/serve.go) would otherwise
      # refuse to start `serve` without it -- add a real "auth" config
      # and drop this var before exposing this stack beyond localhost.
      RUNKITE_ALLOW_INSECURE_SERVE: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Longer than Compose's own 10s default: the server's graceful
    # shutdown drains in-flight HTTP/SSE and gRPC work with its own 15s
    # budget (see cmd/serve.go) before exiting on its own; without this
    # override Compose would SIGKILL the process mid-drain well before
    # that budget is ever used.
    stop_grace_period: 30s
    # /readyz (not /health): actually verifies Postgres/Redis are
    # reachable, not just that the HTTP server is bound -- runner's own
    # `depends_on: condition: service_healthy` below should mean "the
    # control plane can actually accept work," not merely "its process
    # started."
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2026/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      RUNKITE_GRPC_URL: runkite:50051
      RUNKITE_HTTP_URL: http://runkite:2026
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env -- see .env.example}
      # Same DATABASE_URL as the control plane -- enables checkpoint
      # direct mode. The runner writes checkpoints straight to Postgres
      # with its own AsyncPostgresSaver tables, so thread state survives
      # runner restarts. Without this, the runner falls back to an
      # in-memory checkpointer (explicitly ephemeral, dev-only).
      POSTGRES_DSN: postgres://runkite:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env -- see .env.example}@postgres:5432/runkite?sslmode=disable
    depends_on:
      runkite:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

# nginx load balancer for the multi-instance control plane topology
# (docker-compose.multi.yml). Two separate proxy modes in one config:
# plain HTTP/1.1 for the client-facing REST/SSE/WebSocket API, and HTTP/2
# gRPC passthrough for the runner bridge -- nginx needs `grpc_pass` (not
# `proxy_pass`) for the latter, since gRPC is framed over HTTP/2 and a
# plain reverse proxy would mangle it.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # $upstream_addr makes it possible to see WHICH replica actually
    # handled a given request from nginx's own access log alone --
    # genuinely useful for confirming/debugging this file's own sticky
    # /mcp routing (or the round-robin distribution of everything else)
    # without needing to correlate timestamps across three separate
    # replicas' own application logs.
    log_format upstream_debug '$remote_addr - [$time_local] "$request" '
                               'status=$status upstream=$upstream_addr session=$http_mcp_session_id';
    access_log /dev/stdout upstream_debug;

    # Round-robin (nginx's default with no explicit balancing directive) is
    # intentional here, not a placeholder: this setup's whole point is
    # proving requests genuinely land on different replicas and still work,
    # which round-robin does more visibly than a stickier algorithm would.
    upstream runkite_http {
        server runkite-1:2026;
        server runkite-2:2026;
        server runkite-3:2026;
    }

    # MCP-server support (/mcp) needs STICKY routing, unlike the rest of
    # the client-facing API above -- confirmed live, this is a real gap
    # if left on round-robin, not a theoretical one: the Streamable HTTP
    # transport's session state (mcp.NewStreamableHTTPHandler's own
    # session map, and this control plane's own session-ownership
    # tracking in internal/api/mcpserver.go) both live in ONE replica's
    # process memory, keyed by the Mcp-Session-Id header the server
    # assigns on session establishment. A client's "initialize" call
    # landing on replica A, then a later tools/call for that SAME
    # session landing on replica B via round-robin, gets a genuine 404
    # "session not found" from B -- confirmed live by initializing
    # against one replica directly, then repeating the exact same
    # Mcp-Session-Id through this load balancer and observing the
    # request fail once it happened to land elsewhere.
    #
    # Hashed on $remote_addr, NOT $http_mcp_session_id -- confirmed live
    # that hashing on the session ID itself is a real, separate bug, not
    # just a theoretical one: the ID is an opaque, effectively random
    # string a replica assigns AFTER it's already been picked (by
    # whatever key routed the session-less "initialize" call there), so
    # the ID's own hash value has NO relationship to which replica
    # actually holds that session -- roughly a 1-in-N chance per session
    # of landing back on the SAME replica by coincidence, confirmed by
    # running two client sessions back to back: one happened to hash
    # back to its own originating replica, the other did not and got a
    # genuine 404 from a replica that never created it. Hashing on the
    # CLIENT's address instead is consistent across a session's ENTIRE
    # lifetime for a different reason: the key never changes (the
    # client's address is the same on the "initialize" call and every
    # later request, unlike the session ID, which doesn't exist yet on
    # the first one) -- so the client consistently reaches the same
    # replica throughout, by construction, not by chance. `hash ...
    # consistent` (available in open-source nginx, not just nginx-plus,
    # since 1.7.2) needs no sticky cookies or external session store.
    # Standard trade-off, same as nginx's own built-in ip_hash: multiple
    # distinct MCP clients sharing one NAT'd address concentrate onto
    # one replica -- acceptable here since MCP clients (Claude Desktop,
    # Cursor, etc.) are predominantly one address per real user, not
    # many users behind a shared proxy.
    upstream runkite_mcp {
        hash $remote_addr consistent;
        server runkite-1:2026;
        server runkite-2:2026;
        server runkite-3:2026;
    }

    upstream runkite_grpc {
        server runkite-1:50051;
        server runkite-2:50051;
        server runkite-3:50051;
    }

    server {
        listen 2026;

        # SSE and WebSocket both need buffering off and a long read timeout --
        # otherwise nginx buffers the whole SSE stream before forwarding it
        # (defeating streaming entirely) and/or kills long-lived idle
        # WebSocket/SSE connections well before a real run completes.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Matched before the general "/" prefix below regardless of file
        # order (nginx always picks the longest matching prefix
        # location for a plain, non-regex match) -- kept adjacent to it
        # in the file purely for readability. See runkite_mcp's own
        # comment above for why this specific path needs its own
        # sticky-routed upstream instead of the round-robin one below.
        location /mcp {
            proxy_pass http://runkite_mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://runkite_http;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket upgrade support (Agent Protocol's
            # /threads/{id}/stream WS variant) -- conditional upgrade
            # header pass-through, standard nginx WS proxy pattern.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 50051 http2;

        # nginx's gRPC proxy timeouts default to 60s, which killed the
        # runner's WatchCancels stream (a long-lived, mostly-idle server-
        # streaming RPC that only sends data when a cancel actually occurs)
        # every ~60s with a 504 in live testing -- confirmed via runner
        # logs ("WatchCancels error: StatusCode.UNAVAILABLE... status:
        # 504") repeating on a ~60s cadence. GetJob's own 30s long-poll
        # timeout (server side) is comfortably under 60s so it wasn't
        # affected, but any long-poll-style or streaming RPC needs this
        # raised explicitly -- HTTP's proxy_read_timeout above doesn't
        # cover the separate gRPC proxy module.
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;

        location / {
            grpc_pass grpc://runkite_grpc;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}

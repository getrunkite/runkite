<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Runkite ecosystem map</title>
  <desc id="desc">Clients, multi-replica control plane, runners, and pluggable state, transport, and vector backends. Solid boxes are shipped; dashed boxes are community extension points.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="cpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="runnerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .tiny { font-size: 11px; }
      .h { font-size: 13px; font-weight: 700; }
      .title { font-size: 22px; font-weight: 800; fill: #f8fafc; }
      .chip { font-size: 12px; font-weight: 600; }
      .box { font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1100" height="720" rx="18" fill="url(#bg)"/>
  <circle cx="980" cy="80" r="120" fill="#1d4ed8" opacity="0.12"/>
  <circle cx="120" cy="640" r="140" fill="#0f766e" opacity="0.10"/>

  <text x="36" y="42" class="label title">Runkite ecosystem</text>
  <text x="36" y="66" class="label muted tiny">Solid = shipped in-tree · Dashed (+ &) = community can extend · Switch backends via env, no core rewrites</text>

  <!-- Legend -->
  <g transform="translate(780, 28)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2563eb"/>
    <text x="20" y="12" class="label tiny">Shipped</text>
    <rect x="80" y="0" width="14" height="14" rx="3" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="100" y="12" class="label tiny">Extend</text>
    <rect x="155" y="0" width="14" height="14" rx="3" fill="#f59e0b"/>
    <text x="175" y="12" class="label tiny">Supported HA</text>
  </g>

  <!-- Clients -->
  <g filter="url(#soft)">
    <rect x="36" y="100" width="220" height="220" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="52" y="128" class="label h">Clients</text>
    <text x="52" y="148" class="label muted tiny">Agent Protocol surface</text>

    <rect x="52" y="164" width="88" height="36" rx="8" fill="#2563eb"/>
    <text x="96" y="187" text-anchor="middle" class="label chip">HTTP</text>
    <rect x="148" y="164" width="88" height="36" rx="8" fill="#7c3aed"/>
    <text x="192" y="187" text-anchor="middle" class="label chip">SSE</text>
    <rect x="52" y="210" width="184" height="36" rx="8" fill="#0891b2"/>
    <text x="144" y="233" text-anchor="middle" class="label chip">WebSocket</text>

    <rect x="52" y="260" width="184" height="40" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="144" y="285" text-anchor="middle" class="label muted chip">+ custom clients &</text>
  </g>

  <!-- Control plane -->
  <g filter="url(#soft)">
    <rect x="300" y="100" width="500" height="220" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="320" y="128" class="label h">Control plane (Go)</text>
    <text x="320" y="148" class="label muted tiny">Multi-replica HA · embedded Admin UI · job queue · events · cancel · auth</text>

    <!-- replicas -->
    <rect x="320" y="168" width="120" height="56" rx="10" fill="url(#cpGrad)"/>
    <text x="380" y="192" text-anchor="middle" class="label chip">CP replica 1</text>
    <text x="380" y="210" text-anchor="middle" class="label tiny muted" style="fill:#bfdbfe">API · gRPC</text>

    <rect x="456" y="168" width="120" height="56" rx="10" fill="url(#cpGrad)"/>
    <text x="516" y="192" text-anchor="middle" class="label chip">CP replica 2</text>
    <text x="516" y="210" text-anchor="middle" class="label tiny muted" style="fill:#bfdbfe">API · gRPC</text>

    <rect x="592" y="168" width="120" height="56" rx="10" fill="url(#cpGrad)"/>
    <text x="652" y="192" text-anchor="middle" class="label chip">CP replica N</text>
    <text x="652" y="210" text-anchor="middle" class="label tiny muted" style="fill:#bfdbfe">API · gRPC</text>

    <rect x="320" y="240" width="188" height="56" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="414" y="264" text-anchor="middle" class="label chip">Load balancer</text>
    <text x="414" y="282" text-anchor="middle" class="label tiny muted">:2026 HTTP · Admin</text>

    <rect x="524" y="240" width="188" height="56" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="618" y="264" text-anchor="middle" class="label chip">gRPC bridge</text>
    <text x="618" y="282" text-anchor="middle" class="label tiny muted">:50051 runners</text>
  </g>

  <!-- Runners -->
  <g filter="url(#soft)">
    <rect x="844" y="100" width="220" height="220" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="860" y="128" class="label h">Runners</text>
    <text x="860" y="148" class="label muted tiny">Runner Protocol (gRPC)</text>

    <rect x="860" y="164" width="188" height="32" rx="8" fill="url(#runnerGrad)"/>
    <text x="954" y="185" text-anchor="middle" class="label chip">LangGraph · LangChain</text>
    <rect x="860" y="204" width="188" height="32" rx="8" fill="url(#runnerGrad)"/>
    <text x="954" y="225" text-anchor="middle" class="label chip">CrewAI · LlamaIndex</text>
    <rect x="860" y="244" width="188" height="32" rx="8" fill="url(#runnerGrad)"/>
    <text x="954" y="265" text-anchor="middle" class="label chip">AutoGen · LangGraph.js</text>
    <rect x="860" y="284" width="188" height="24" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="954" y="301" text-anchor="middle" class="label muted tiny">+ more frameworks &</text>
  </g>

  <!-- Arrows top -->
  <path d="M256 210 H300" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M800 210 H844" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="268" y="198" class="label tiny muted">protocol</text>
  <text x="805" y="198" class="label tiny muted">GetJob /</text>
  <text x="805" y="212" class="label tiny muted">events</text>

  <!-- State -->
  <g filter="url(#soft)">
    <rect x="36" y="360" width="330" height="300" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="52" y="388" class="label h">State</text>
    <text x="52" y="408" class="label muted tiny">Threads · runs · checkpoints · store</text>

    <rect x="52" y="428" width="140" height="40" rx="8" fill="#f59e0b"/>
    <text x="122" y="453" text-anchor="middle" class="label chip" style="fill:#111827">Postgres </text>
    <rect x="204" y="428" width="140" height="40" rx="8" fill="#2563eb"/>
    <text x="274" y="453" text-anchor="middle" class="label chip">SQLite</text>

    <rect x="52" y="480" width="140" height="40" rx="8" fill="#2563eb"/>
    <text x="122" y="505" text-anchor="middle" class="label chip">MySQL</text>
    <rect x="204" y="480" width="140" height="40" rx="8" fill="#2563eb"/>
    <text x="274" y="505" text-anchor="middle" class="label chip">MongoDB</text>

    <rect x="52" y="532" width="292" height="44" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="198" y="559" text-anchor="middle" class="label muted chip">+ other databases &</text>

    <text x="52" y="620" class="label tiny muted"> Supported HA profile (direct-mode checkpoints)</text>
  </g>

  <!-- Transport -->
  <g filter="url(#soft)">
    <rect x="386" y="360" width="330" height="300" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="402" y="388" class="label h">Transport</text>
    <text x="402" y="408" class="label muted tiny">Job queue · event broker · cancel bus</text>

    <rect x="402" y="428" width="140" height="40" rx="8" fill="#f59e0b"/>
    <text x="472" y="453" text-anchor="middle" class="label chip" style="fill:#111827">Redis </text>
    <rect x="554" y="428" width="140" height="40" rx="8" fill="#2563eb"/>
    <text x="624" y="453" text-anchor="middle" class="label chip">NATS / JS</text>

    <rect x="402" y="480" width="292" height="40" rx="8" fill="#2563eb"/>
    <text x="548" y="505" text-anchor="middle" class="label chip">Kafka (queue) + Redis broker</text>

    <rect x="402" y="532" width="292" height="44" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="548" y="559" text-anchor="middle" class="label muted chip">+ other streams / buses &</text>

    <text x="402" y="620" class="label tiny muted"> Full triad for multi-replica HA · Kafka alone is experimental</text>
  </g>

  <!-- Vectors -->
  <g filter="url(#soft)">
    <rect x="736" y="360" width="328" height="300" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="752" y="388" class="label h">Vector stores</text>
    <text x="752" y="408" class="label muted tiny">Optional retrieval backends</text>

    <rect x="752" y="428" width="140" height="40" rx="8" fill="#f59e0b"/>
    <text x="822" y="453" text-anchor="middle" class="label chip" style="fill:#111827">pgvector </text>
    <rect x="904" y="428" width="140" height="40" rx="8" fill="#2563eb"/>
    <text x="974" y="453" text-anchor="middle" class="label chip">Qdrant</text>

    <rect x="752" y="480" width="140" height="40" rx="8" fill="#2563eb"/>
    <text x="822" y="505" text-anchor="middle" class="label chip">Weaviate</text>
    <rect x="904" y="480" width="140" height="40" rx="8" fill="#2563eb"/>
    <text x="974" y="505" text-anchor="middle" class="label chip">Pinecone</text>

    <rect x="752" y="532" width="292" height="44" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="898" y="559" text-anchor="middle" class="label muted chip">+ other vector DBs &</text>

    <text x="752" y="620" class="label tiny muted">Same runner API  pick the store your stack already uses</text>
  </g>

  <!-- Connecting lines from CP down -->
  <path d="M450 320 V352" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M550 320 V352" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M650 320 V352" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="458" y="346" class="label tiny muted">state</text>
  <text x="558" y="346" class="label tiny muted">transport</text>
  <text x="658" y="346" class="label tiny muted">vectors</text>
</svg>

name: Bug report
description: Report a defect in Runkite
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security vulnerabilities, do **not** use this form — see [SECURITY.md](https://github.com/getrunkite/runkite/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps, config snippets, or commands.
      placeholder: |
        1. Start control plane with …
        2. Start runner …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Logs, status codes, or SSE snippets help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: "`runkite version`, git SHA, or release tag."
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Control plane
        - Python runner
        - TypeScript runner
        - Admin UI
        - Transport / state backend
        - Docs
        - Other

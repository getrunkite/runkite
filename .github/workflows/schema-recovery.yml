name: Schema recovery

on:
  pull_request:
    paths:
      - cmd/**
      - internal/api/**
      - internal/auth/**
      - internal/state/**
      - python/runkite_runner/**
      - python/tests/test_schema*.py
      - python/tests/fixtures/schema_recovery_graph.py
      - python/requirements.txt
      - go.mod
      - go.sum
      - .github/workflows/schema-recovery.yml
  push:
    branches: [main]
    paths:
      - cmd/**
      - internal/api/**
      - internal/auth/**
      - internal/state/**
      - python/runkite_runner/**
      - python/tests/test_schema*.py
      - python/tests/fixtures/schema_recovery_graph.py
      - python/requirements.txt
      - go.mod
      - go.sum
      - .github/workflows/schema-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install existing runner dependencies
        run: python -m pip install -r python/requirements.txt
      - name: Schema publisher regressions
        run: |
          python python/tests/test_schema_introspect.py
          python python/tests/test_schema_recovery.py
      - name: Build the real control plane
        run: go build -o "$RUNNER_TEMP/runkite-schema-recovery" ./cmd/
      - name: Recover during idle restart and a busy assignment
        env:
          RUNKITE_TEST_SCHEMA_RECOVERY_BINARY: ${{ runner.temp }}/runkite-schema-recovery
        run: timeout --signal=TERM --kill-after=30s 300 python python/tests/test_schema_recovery_native.py -v

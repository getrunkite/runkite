# Attach OpenAPI specs to GitHub Releases when a version tag is pushed.
# Clients can download the contract without cloning the repo.
#
#   git tag v0.x.y && git push origin v0.x.y
#
# Assets: openapi.json, openapi-admin.json, openapi-internal.json
name: Release OpenAPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  attach-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify specs still match the mux
        run: python3 scripts/openapi/check.py

      - name: Attach OpenAPI specs to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            spec/openapi.json
            spec/openapi-admin.json
            spec/openapi-internal.json
          fail_on_unmatched_files: true
          generate_release_notes: true

# Cut a GitHub Release + publish artifacts when a v* tag is pushed.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Always: Go binaries (GoReleaser), OpenAPI specs, GHCR images.
# Optional (needs repo secrets): PyPI (PYPI_API_TOKEN), npm (NPM_TOKEN).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify OpenAPI specs
        run: python3 scripts/openapi/check.py

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          TAGS_CP="ghcr.io/getrunkite/runkite:${V}"
          TAGS_PY="ghcr.io/getrunkite/runkite-runner:${V}"
          TAGS_TS="ghcr.io/getrunkite/runkite-runner-ts:${V}"
          if [ "$V" = "$FILE_V" ]; then
            TAGS_CP="${TAGS_CP}"$'\n'"ghcr.io/getrunkite/runkite:latest"
            TAGS_PY="${TAGS_PY}"$'\n'"ghcr.io/getrunkite/runkite-runner:latest"
            TAGS_TS="${TAGS_TS}"$'\n'"ghcr.io/getrunkite/runkite-runner-ts:latest"
          fi
          {
            echo "tags_cp<<EOF"
            echo "$TAGS_CP"
            echo "EOF"
            echo "tags_py<<EOF"
            echo "$TAGS_PY"
            echo "EOF"
            echo "tags_ts<<EOF"
            echo "$TAGS_TS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push control plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.ver.outputs.tags_cp }}

      - name: Push Python runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags_py }}

      - name: Push TypeScript runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner-ts
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags_ts }}

  pypi:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        working-directory: python
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          password: ${{ env.PYPI_API_TOKEN }}
      - name: Skip notice
        if: ${{ env.PYPI_API_TOKEN == '' }}
        run: echo "PYPI_API_TOKEN not set — skipping PyPI publish (binaries/GHCR still released)."

  npm:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: typescript/runkite-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --access public
      - name: Skip notice
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        run: echo "NPM_TOKEN not set — skipping npm publish (binaries/GHCR still released)."

# Cut a GitHub Release + publish artifacts when a v* tag is pushed.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Always: Go binaries (GoReleaser), OpenAPI specs, GHCR images.
# Optional (needs repo secrets): PyPI (PYPI_API_TOKEN), npm (NPM_TOKEN).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Verify OpenAPI specs
        run: python3 scripts/openapi/check.py

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version from tag
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "git_commit=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          TAGS_CP="ghcr.io/getrunkite/runkite:${V}"
          TAGS_PY="ghcr.io/getrunkite/runkite-runner:${V}"
          TAGS_TS="ghcr.io/getrunkite/runkite-runner-ts:${V}"
          if [ "$V" = "$FILE_V" ]; then
            TAGS_CP="${TAGS_CP}"$'\n'"ghcr.io/getrunkite/runkite:latest"
            TAGS_PY="${TAGS_PY}"$'\n'"ghcr.io/getrunkite/runkite-runner:latest"
            TAGS_TS="${TAGS_TS}"$'\n'"ghcr.io/getrunkite/runkite-runner-ts:latest"
          fi
          {
            echo "tags_cp<<EOF"
            echo "$TAGS_CP"
            echo "EOF"
            echo "tags_py<<EOF"
            echo "$TAGS_PY"
            echo "EOF"
            echo "tags_ts<<EOF"
            echo "$TAGS_TS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push control plane image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_COMMIT=${{ steps.ver.outputs.git_commit }}
          tags: ${{ steps.ver.outputs.tags_cp }}

      - name: Push Python runner image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags_py }}

      - name: Push TypeScript runner image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.runner-ts
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags_ts }}

  pypi:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel
        working-directory: python
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python/dist/
          password: ${{ env.PYPI_API_TOKEN }}
      - name: Skip notice
        if: ${{ env.PYPI_API_TOKEN == '' }}
        run: echo "PYPI_API_TOKEN not set — skipping PyPI publish (binaries/GHCR still released)."

  # Prefer npm Trusted Publishing (OIDC). Configure once on npmjs.com after the
  # package exists: Package → Settings → Trusted Publisher → GitHub Actions
  #   Organization: getrunkite
  #   Repository:   runkite
  #   Workflow:     release.yml
  #   Allowed:      npm publish
  # Falls back to NPM_TOKEN (granular + Bypass 2FA) if OIDC is not configured.
  npm:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript/runkite-runner
    # secrets.* is not a valid context in step `if:` (job/step if only sees
    # env/github/needs/vars/inputs/etc, not secrets) -- referencing it there
    # fails the WHOLE workflow file's validation, not just this job. Mirror
    # the pypi job above: lift the secret into env once, gate on that.
    env:
      NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # OIDC trusted publishing must NOT see NODE_AUTH_TOKEN — if the secret is
      # set, npm prefers the token and 2FA/WebAuthn packages fail with EOTP in CI.
      # Fallback token path only when NPM_TOKEN is present AND OIDC publish fails.
      - name: Publish to npm (OIDC trusted publishing)
        id: npm_oidc
        continue-on-error: true
        run: |
          V="${GITHUB_REF_NAME#v}"
          if npm view "runkite-runner@${V}" version >/dev/null 2>&1; then
            echo "runkite-runner@${V} already on npm — skipping publish"
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish --access public
          echo "skipped=0" >> "$GITHUB_OUTPUT"
      - name: Publish to npm (NPM_TOKEN fallback)
        if: ${{ steps.npm_oidc.outcome == 'failure' && env.NPM_TOKEN_SET == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          if npm view "runkite-runner@${V}" version >/dev/null 2>&1; then
            echo "runkite-runner@${V} already on npm — skipping publish"
            exit 0
          fi
          npm publish --access public
      - name: Fail if npm not published
        if: ${{ steps.npm_oidc.outcome == 'failure' && env.NPM_TOKEN_SET != 'true' }}
        run: |
          echo "OIDC npm publish failed and NPM_TOKEN is unset."
          echo "Configure Trusted Publisher on npmjs.com for getrunkite/runkite release.yml,"
          echo "or publish locally: cd typescript/runkite-runner && npm publish --access public"
          exit 1

# Cut a GitHub Release + publish artifacts when a v* tag is pushed.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Always: Go binaries (GoReleaser), OpenAPI specs, GHCR images.
# PyPI and npm publication require the configured package authorization below.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: Existing immutable release tag to recover
        required: true
        type: string
      source_run_id:
        description: Original Release run containing the retained distributions
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify coordinated versions and release tag before publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m unittest discover -s python/tests -p test_release_version.py
          python3 scripts/check-release-version.py --tag "$RELEASE_TAG"

  goreleaser:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [version-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Verify OpenAPI specs
        run: python3 scripts/openapi/check.py

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [version-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version from tag
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "git_commit=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          TAGS_CP="ghcr.io/getrunkite/runkite:${V}"
          TAGS_PY="ghcr.io/getrunkite/runkite-runner:${V}"
          TAGS_TS="ghcr.io/getrunkite/runkite-runner-ts:${V}"
          if [ "$V" = "$FILE_V" ]; then
            TAGS_CP="${TAGS_CP}"$'\n'"ghcr.io/getrunkite/runkite:latest"
            TAGS_PY="${TAGS_PY}"$'\n'"ghcr.io/getrunkite/runkite-runner:latest"
            TAGS_TS="${TAGS_TS}"$'\n'"ghcr.io/getrunkite/runkite-runner-ts:latest"
          fi
          {
            echo "tags_cp<<EOF"
            echo "$TAGS_CP"
            echo "EOF"
            echo "tags_py<<EOF"
            echo "$TAGS_PY"
            echo "EOF"
            echo "tags_ts<<EOF"
            echo "$TAGS_TS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push control plane image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            GIT_COMMIT=${{ steps.ver.outputs.git_commit }}
          tags: ${{ steps.ver.outputs.tags_cp }}

      - name: Push Python runner image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags_py }}

      - name: Push TypeScript runner image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.runner-ts
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags_ts }}


  pypi:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [version-check, goreleaser]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: runkite-runner
            directory: python
          - package: runkite-governance
            directory: python/runkite_governance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: python -m pip install -r python/requirements-build.txt
      - name: Build distributions once
        id: artifact
        env:
          PACKAGE_DIR: ${{ matrix.directory }}
          ARTIFACT_DIR: ${{ runner.temp }}/pypi-${{ matrix.package }}
        run: python scripts/release_artifacts.py build pypi "$PACKAGE_DIR" "$ARTIFACT_DIR"
      - name: Verify installed governance distributions and Microsoft middleware
        if: ${{ matrix.package == 'runkite-governance' }}
        env:
          RUNKITE_GOVERNANCE_PYTHON_ARTIFACTS: ${{ steps.artifact.outputs.artifact_dir }}
        run: |
          python -m pip install 'agent-framework-core==1.23.0'
          python python/tests/test_governance_package_artifacts.py -v
      - name: Check existing distributions and stage only missing files
        id: registry
        env:
          MANIFEST: ${{ steps.artifact.outputs.manifest_path }}
          PENDING_DIR: ${{ steps.artifact.outputs.artifact_dir }}/pending
        run: python scripts/release_artifacts.py check "$MANIFEST" --pending-dir "$PENDING_DIR"
      - name: Require runner publication credentials for missing distributions
        if: ${{ steps.registry.outputs.pending == 'true' && matrix.package == 'runkite-runner' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "Missing PYPI_API_TOKEN. Publication has not happened. Configure the runner project-scoped credential before retrying."
            exit 1
          fi
      - name: Publish verified missing runner files to PyPI using its token
        id: pypi_token
        if: ${{ steps.registry.outputs.pending == 'true' && matrix.package == 'runkite-runner' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ steps.artifact.outputs.artifact_dir }}/pending/
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish verified missing governance files to PyPI using OIDC
        id: pypi_oidc
        if: ${{ steps.registry.outputs.pending == 'true' && matrix.package == 'runkite-governance' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ steps.artifact.outputs.artifact_dir }}/pending/
      - name: Verify actual PyPI publication
        id: pypi_verify
        if: ${{ !cancelled() && steps.registry.outcome == 'success' }}
        env:
          MANIFEST: ${{ steps.artifact.outputs.manifest_path }}
        run: python scripts/release_artifacts.py check "$MANIFEST" --require-present --wait-seconds 300
      - name: Record actual PyPI authentication path
        if: ${{ !cancelled() && steps.registry.outcome == 'success' }}
        env:
          INITIAL_STATE: ${{ steps.registry.outputs.state }}
          TOKEN_OUTCOME: ${{ steps.pypi_token.outcome }}
          OIDC_OUTCOME: ${{ steps.pypi_oidc.outcome }}
          VERIFY_OUTCOME: ${{ steps.pypi_verify.outcome }}
        run: |
          {
            printf 'Initial registry state: %s\n' "$INITIAL_STATE"
            printf 'Runner token step outcome: %s\n' "$TOKEN_OUTCOME"
            printf 'Governance OIDC step outcome: %s\n' "$OIDC_OUTCOME"
            printf 'Artifact verification outcome: %s\n' "$VERIFY_OUTCOME"
            printf 'An existing matching version is recovery evidence, not a new OIDC publication.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain intended distributions and integrity manifest
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-${{ matrix.package }}-${{ github.ref_name }}
          path: ${{ steps.artifact.outputs.artifact_dir }}
          retention-days: 30

  # A manual recovery uses this controller's fixes with the original tag's
  # package source and retained PyPI files. It never recreates Go/image assets.
  recovery-source:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      source_revision: ${{ steps.source.outputs.source_revision }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate immutable source tag and original release evidence
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python scripts/prepare_release_recovery.py --tag "$RECOVERY_TAG" --source-run-id "$SOURCE_RUN_ID"
      - name: Check out the validated package source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.source.outputs.source_revision }}
          path: _release-source
          persist-credentials: false
      - name: Verify the original source's coordinated release version
        env:
          RECOVERY_TAG: ${{ steps.source.outputs.tag }}
        run: python _release-source/scripts/check-release-version.py --tag "$RECOVERY_TAG"

  pypi-recovery-verify:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: [recovery-source]
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        package: [runkite-runner, runkite-governance]
    env:
      RECOVERY_TAG: ${{ needs.recovery-source.outputs.tag }}
      RECOVERY_VERSION: ${{ needs.recovery-source.outputs.version }}
      SOURCE_RUN_ID: ${{ needs.recovery-source.outputs.source_run_id }}
      ARTIFACT_DIR: ${{ github.workspace }}/_release-artifacts/pypi-${{ matrix.package }}
      PACKAGE_NAME: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Download only the original retained PyPI distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --repo getrunkite/runkite \
            --name "pypi-$PACKAGE_NAME-$RECOVERY_TAG" --dir "$ARTIFACT_DIR"
      - name: Validate retained artifact identity
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from prepare_release_recovery import validate_intended_manifest
          validate_intended_manifest(
              Path(os.environ["ARTIFACT_DIR"]) / "manifest.json",
              os.environ["PACKAGE_NAME"], os.environ["RECOVERY_VERSION"], "pypi",
          )
          PY
      - name: Record the read-only recovery identity
        env:
          SOURCE_REVISION: ${{ needs.recovery-source.outputs.source_revision }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path(os.environ["ARTIFACT_DIR"], "source.json").write_text(json.dumps({
              "tag": os.environ["RECOVERY_TAG"],
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "source_revision": os.environ["SOURCE_REVISION"],
              "controller_revision": os.environ["GITHUB_SHA"],
              "operation": "pypi_verify_only",
          }, indent=2) + "\n")
          PY
      - name: Verify original distributions against actual PyPI downloads without publishing
        run: python scripts/release_artifacts.py check "$ARTIFACT_DIR/manifest.json" --require-present --wait-seconds 300
      - name: Retain original distributions and verification identity
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-recovery-${{ matrix.package }}-${{ needs.recovery-source.outputs.tag }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30

  # Each package needs its own trusted publisher or project-scoped fallback.
  # Existing versions count only after the intended immutable files match.
  npm:
    if: ${{ always() && !cancelled() && ((github.event_name == 'push' && needs.version-check.result == 'success' && needs.goreleaser.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.recovery-source.result == 'success')) }}
    runs-on: ubuntu-latest
    needs: [version-check, goreleaser, recovery-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: runkite-runner
            directory: typescript/runkite-runner
            token_secret: NPM_TOKEN
          - package: runkite-governance
            directory: typescript/runkite-governance
            token_secret: NPM_GOVERNANCE_TOKEN
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN_SET: ${{ secrets[matrix.token_secret] != '' }}
      SOURCE_ROOT: ${{ github.event_name == 'workflow_dispatch' && '_release-source' || '.' }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && needs.recovery-source.outputs.tag || github.ref_name }}
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && needs.recovery-source.outputs.version || '' }}
      SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && needs.recovery-source.outputs.source_revision || github.sha }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && needs.recovery-source.outputs.source_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out the validated original npm source for manual recovery
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.recovery-source.outputs.source_revision }}
          path: _release-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Install the trusted-publishing npm client
        run: |
          npm install --global npm@12.2.2
          node --version
          npm --version
      - name: Install locked package dependencies
        working-directory: ${{ env.SOURCE_ROOT }}/${{ matrix.directory }}
        run: npm ci
      - name: Build and pack once without publication lifecycle scripts
        id: artifact
        env:
          PACKAGE_DIR: ${{ env.SOURCE_ROOT }}/${{ matrix.directory }}
          ARTIFACT_DIR: ${{ runner.temp }}/npm-${{ matrix.package }}
        run: python scripts/release_artifacts.py build npm "$PACKAGE_DIR" "$ARTIFACT_DIR"
      - name: Bind the npm artifact to the intended tag and source
        env:
          MANIFEST: ${{ steps.artifact.outputs.manifest_path }}
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["MANIFEST"])
          import sys
          sys.path.insert(0, "scripts")
          from prepare_release_recovery import validate_intended_manifest
          validate_intended_manifest(path, os.environ["PACKAGE_NAME"], os.environ["RELEASE_TAG"][1:], "npm")
          Path(path.parent, "source.json").write_text(json.dumps({
              "tag": os.environ["RELEASE_TAG"],
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "source_revision": os.environ["SOURCE_REVISION"],
              "controller_revision": os.environ["GITHUB_SHA"],
              "operation": "npm_publish_or_verify",
          }, indent=2) + "\n")
          PY
      - name: Verify installed governance tarball and native AI SDK integration
        if: ${{ matrix.package == 'runkite-governance' }}
        env:
          TARBALL: ${{ steps.artifact.outputs.artifact_path }}
        run: |
          (cd "$SOURCE_ROOT/examples/governance_ai_sdk" && npm ci)
          node "$SOURCE_ROOT/scripts/verify_governance_npm.mjs" "$TARBALL"
      - name: Check intended immutable npm artifact
        id: registry
        env:
          MANIFEST: ${{ steps.artifact.outputs.manifest_path }}
        run: python scripts/release_artifacts.py check "$MANIFEST"
      - name: Publish verified tarball using OIDC
        id: npm_oidc
        if: ${{ steps.registry.outputs.pending == 'true' }}
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ""
          TARBALL: ${{ steps.artifact.outputs.artifact_path }}
        run: |
          set -euo pipefail
          npm publish "$TARBALL" --access public --ignore-scripts --registry https://registry.npmjs.org
      - name: Reconcile possible lost npm publish acknowledgement
        id: reconcile
        if: ${{ steps.registry.outputs.pending == 'true' }}
        env:
          MANIFEST: ${{ steps.artifact.outputs.manifest_path }}
        run: python scripts/release_artifacts.py check "$MANIFEST" --wait-seconds 5
      - name: Publish verified tarball using scoped fallback
        id: npm_fallback
        if: ${{ steps.npm_oidc.outcome == 'failure' && steps.reconcile.outputs.pending == 'true' && env.NPM_TOKEN_SET == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.token_secret] }}
          TARBALL: ${{ steps.artifact.outputs.artifact_path }}
        run: |
          set -euo pipefail
          npm publish "$TARBALL" --access public --ignore-scripts --registry https://registry.npmjs.org
      - name: Verify actual npm publication
        if: ${{ !cancelled() && steps.registry.outcome == 'success' }}
        env:
          MANIFEST: ${{ steps.artifact.outputs.manifest_path }}
        run: python scripts/release_artifacts.py check "$MANIFEST" --require-present --wait-seconds 300
      - name: Record actual authentication path
        if: ${{ !cancelled() && steps.registry.outcome == 'success' }}
        env:
          INITIAL_STATE: ${{ steps.registry.outputs.state }}
          OIDC_OUTCOME: ${{ steps.npm_oidc.outcome }}
          FALLBACK_OUTCOME: ${{ steps.npm_fallback.outcome }}
        run: |
          {
            printf 'Initial registry state: %s\n' "$INITIAL_STATE"
            printf 'OIDC step outcome: %s\n' "$OIDC_OUTCOME"
            printf 'Fallback step outcome: %s\n' "$FALLBACK_OUTCOME"
            printf 'An existing matching version is recovery evidence, not a new OIDC publication.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain verified tarball and integrity manifest
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.package }}-${{ env.RELEASE_TAG }}-${{ github.run_id }}
          path: ${{ steps.artifact.outputs.artifact_dir }}
          retention-days: 30

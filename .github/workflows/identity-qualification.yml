name: Identity and external workload qualification

# Explicit, bounded execution of a real external runtime. Ordinary PR CI keeps
# the adversarial unit/storage gates; this job is not an independent assessment.
on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Bounded failover and partial-usage cycles (1 through 20)
        required: true
        default: 1
        type: number

permissions:
  contents: read

concurrency:
  group: identity-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  combined-ha:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QUALIFICATION_REPETITIONS: ${{ inputs.repetitions }}
      UV_NO_CONFIG: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate bounded request and host
        shell: bash
        run: |
          set -euo pipefail
          QUALIFICATION_OUTPUT="$RUNNER_TEMP/runkite-identity-qualification"
          printf 'QUALIFICATION_OUTPUT=%s\n' "$QUALIFICATION_OUTPUT" >> "$GITHUB_ENV"
          if [[ ! "$QUALIFICATION_REPETITIONS" =~ ^([1-9]|1[0-9]|20)$ ]]; then
            echo 'repetitions must be an integer from 1 through 20' >&2
            exit 2
          fi
          if [[ "$(uname -s)" != Linux || "$(uname -m)" != x86_64 ]]; then
            echo 'This profile requires native Linux amd64 with Docker and Landlock.' >&2
            exit 2
          fi
          mkdir -p "$QUALIFICATION_OUTPUT/build" "$QUALIFICATION_OUTPUT/ha" "$QUALIFICATION_OUTPUT/cli"
          docker compose version
          docker version --format '{{.Server.Version}}' > "$QUALIFICATION_OUTPUT/docker-version.txt"
          python3 - "$QUALIFICATION_OUTPUT/docker-version.txt" <<'PY'
          import re
          import sys
          from pathlib import Path
          version = Path(sys.argv[1]).read_text().strip()
          match = re.match(r"^(\d+)\.", version)
          if not match or int(match[1]) < 28:
              raise SystemExit("OpenShell 0.1.8 requires Docker Engine 28 or newer for this qualification.")
          PY
          uname -sr > "$QUALIFICATION_OUTPUT/kernel.txt"
          python3 - "$QUALIFICATION_OUTPUT/landlock-abi.txt" <<'PY'
          import ctypes
          import sys
          from pathlib import Path
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          # Native Linux amd64 was required above. Query the supported ABI;
          # actual hard_requirement policy enforcement is still tested later.
          abi = libc.syscall(444, 0, 0, 1)
          if abi < 1:
              raise SystemExit("Landlock is unavailable on this host; this profile cannot qualify and will not skip as passed.")
          Path(sys.argv[1]).write_text(str(abi) + "\n")
          PY

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"

      - name: Install existing build and fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r python/requirements-build.txt -r python/requirements.txt 'uv==0.12.23'
          python3 -m pip freeze > "$QUALIFICATION_OUTPUT/build/orchestrator-requirements.txt"
          uv --version > "$QUALIFICATION_OUTPUT/build/uv-version.txt"

      - name: Install checksum-pinned official OpenShell CLI
        shell: bash
        run: |
          set -euo pipefail
          archive=openshell-x86_64-unknown-linux-musl.tar.gz
          # Official v0.1.8 asset digest, also listed in openshell-checksums-sha256.txt:
          # https://github.com/NVIDIA/OpenShell/releases/expanded_assets/v0.1.8
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/NVIDIA/OpenShell/releases/download/v0.1.8/$archive" \
            --output "$QUALIFICATION_OUTPUT/cli/$archive"
          printf '%s  %s\n' \
            87f5c41d396dcd36b4c30a7b5e6f41643a656cb31a82b0edbb00319c9a719c2d \
            "$QUALIFICATION_OUTPUT/cli/$archive" | sha256sum --check --strict
          tar -xzf "$QUALIFICATION_OUTPUT/cli/$archive" -C "$QUALIFICATION_OUTPUT/cli" -- openshell
          chmod 700 "$QUALIFICATION_OUTPUT/cli/openshell"
          "$QUALIFICATION_OUTPUT/cli/openshell" --version > "$QUALIFICATION_OUTPUT/build/openshell-version.txt"

      - name: Build the checked-out candidate binary and runner wheel
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          python3 scripts/check-release-version.py
          version="$(tr -d '[:space:]' < VERSION)"
          revision="$(git rev-parse HEAD)"
          go build -trimpath -ldflags "-X main.Version=$version -X main.GitCommit=$revision" \
            -o "$QUALIFICATION_OUTPUT/build/runkite" ./cmd
          python3 -m build --wheel --no-isolation --outdir "$QUALIFICATION_OUTPUT/build/wheel" python
          "$QUALIFICATION_OUTPUT/build/runkite" version > "$QUALIFICATION_OUTPUT/build/runkite-version.txt"
          sha256sum "$QUALIFICATION_OUTPUT/build/runkite" "$QUALIFICATION_OUTPUT"/build/wheel/*.whl \
            > "$QUALIFICATION_OUTPUT/build/artifact-sha256.txt"
          python3 - "$QUALIFICATION_OUTPUT/build/source.json" <<'PY'
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "version": Path("VERSION").read_text().strip(),
              "architecture": platform.machine(),
              "kernel": platform.release(),
              "repetitions": int(os.environ["QUALIFICATION_REPETITIONS"]),
              "assessment": "maintainer combined fixture, not independent review",
          }, indent=2) + "\n")
          PY

      - name: Test supervisor and fixture cleanup failure paths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_review_ha_supervisor.py
          python3 scripts/test_identity_security_entrypoint.py
          PYTHONPATH=python python3 -m unittest discover -s python/tests -p test_isolated_fixture.py -v

      - name: Pack and install a TypeScript strict-mTLS worker
        timeout-minutes: 5
        working-directory: typescript/runkite-runner
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-identity-qualification"
          npm ci
          npm run build
          export RUNKITE_TEST_WORKLOAD_BINARY="$QUALIFICATION_OUTPUT/build/runkite"
          export RUNKITE_TEST_WORKLOAD_OUTPUT="$QUALIFICATION_OUTPUT/typescript-workload.json"
          node --import tsx --test src/workloadIdentity.e2e.test.ts

      - name: Two real TLS planes, installed runner and external runtime
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          wheels=("$QUALIFICATION_OUTPUT"/build/wheel/*.whl)
          if [[ "${#wheels[@]}" != 1 || ! -f "${wheels[0]}" ]]; then
            echo 'Expected exactly one newly built runner wheel.' >&2
            exit 1
          fi
          export RUNKITE_TEST_BINARY="$QUALIFICATION_OUTPUT/build/runkite"
          export RUNKITE_TEST_RUNNER_WHEEL="${wheels[0]}"
          export RUNKITE_TEST_ISOLATED_CLI="$QUALIFICATION_OUTPUT/cli/openshell"
          export RUNKITE_TEST_ISOLATED_REPETITIONS="$QUALIFICATION_REPETITIONS"
          export RUNKITE_TEST_ISOLATED_HA_OUTPUT="$QUALIFICATION_OUTPUT/ha"
          RUNKITE_TEST_ISOLATED_PYTHON="$(command -v python3)"
          export RUNKITE_TEST_ISOLATED_PYTHON
          timeout --signal=TERM --kill-after=120s 1800 bash scripts/test-isolated-ha.sh

      - name: Require measured success and confirmed cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["QUALIFICATION_OUTPUT"])
          typescript = json.loads((output / "typescript-workload.json").read_text())
          if typescript.get("passed") is not True or len(typescript.get("cases", [])) < 4:
              raise SystemExit("Packaged TypeScript strict-mTLS qualification did not complete.")
          root = output / "ha/runtime"
          evidence = json.loads((root / "managed-evidence.json").read_text())
          cleanup = json.loads((root / "runtime-cleanup.json").read_text())
          runtime = json.loads((root / "runtime-fixture.json").read_text())
          gateway_tls = json.loads((root / "gateway-tls-evidence.json").read_text())
          expected = int(os.environ["QUALIFICATION_REPETITIONS"])
          if evidence.get("passed") is not True or evidence.get("bounded_repetitions") != expected:
              raise SystemExit("Combined qualification did not prove every requested cycle.")
          if not str(evidence.get("scope", "")).startswith("two real Postgres/Redis planes"):
              raise SystemExit("Expected the real two-plane profile, not a unit or SQLite fallback.")
          if cleanup.get("confirmed") is not True:
              raise SystemExit("Owned runtime cleanup was not confirmed.")
          if runtime.get("gateway_tls") is not True or runtime.get("client_auth") != "mtls" or gateway_tls.get("passed") is not True:
              raise SystemExit("Expected measured external gateway mTLS, not a plaintext fallback.")
          cycles = [case for case in evidence.get("cases", []) if case.startswith("bounded cycle ")]
          if len(cycles) != expected:
              raise SystemExit("Missing measured failover cycles.")
          PY

      # Private recovery directories can contain task-local TLS keys. Upload
      # only explicit safe logs/metadata, including on test or setup failure.
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: identity-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/runkite-identity-qualification/kernel.txt
            ${{ runner.temp }}/runkite-identity-qualification/docker-version.txt
            ${{ runner.temp }}/runkite-identity-qualification/landlock-abi.txt
            ${{ runner.temp }}/runkite-identity-qualification/build/*.txt
            ${{ runner.temp }}/runkite-identity-qualification/build/source.json
            ${{ runner.temp }}/runkite-identity-qualification/typescript-workload.json
            ${{ runner.temp }}/runkite-identity-qualification/typescript-workload.json.plane.log
            ${{ runner.temp }}/runkite-identity-qualification/typescript-workload.json.runner.log
            ${{ runner.temp }}/runkite-identity-qualification/ha/*.log
            ${{ runner.temp }}/runkite-identity-qualification/ha/runtime/*.log
            ${{ runner.temp }}/runkite-identity-qualification/ha/runtime/*.json

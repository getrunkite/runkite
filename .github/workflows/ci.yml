name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector:pg16 (drop-in postgres:16 + pgvector extension
        # binary) so the vector store test suite (internal/vectorstore/pgvector)
        # can run in CI, not just against a developer's local docker-compose.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: runkite
          POSTGRES_PASSWORD: runkite
          POSTGRES_DB: runkite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runkite -d runkite_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

      mysql:
        # The second SQL exemplar alongside Postgres/SQLite
        # (internal/state/mysql) -- same conformance suite, so this
        # needs to run in CI too, not just locally. Unlike mongo below,
        # MySQL's default command needs no override for this project's
        # purposes, so a normal `services:` entry (not a manual `docker
        # run` step) is sufficient.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: runkite
          MYSQL_USER: runkite
          MYSQL_PASSWORD: runkite
          MYSQL_DATABASE: runkite_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -prunkite"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

      qdrant:
        # The non-SQL exemplar vectorstore.VectorStore backend
        # (internal/vectorstore/qdrant) -- same conformance suite as
        # pgvector, so this needs to run in CI too, not just locally.
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python runner dependencies
        run: pip install -r python/requirements.txt

      - name: Python lint (ruff)
        run: |
          pip install -r python/requirements-dev.txt
          ruff check python/ python/adapters/
          ruff format --check python/ python/adapters/

      - name: Install example custom-app dependencies
        # fastapi is the example custom_routes_agent app's own framework
        # choice, not a runkite_runner dependency (uvicorn alone, already in
        # requirements.txt, is all the SDK needs to serve any ASGI app) --
        # installed separately so CI actually exercises test_custom_app.py
        # instead of it silently skipping.
        run: pip install fastapi

      - name: Admin UI - install, lint, typecheck, build
        # Builds straight into internal/adminui/dist (see admin-ui/vite.config.ts),
        # so the Go build step right after this actually exercises a fresh
        # bundle instead of whatever was last committed.
        # Pin npm 10 to match packageManager / engines -- local npm 11
        # rewrites lockfile keys CI's npm 10 cannot resolve (@emnapi/*).
        working-directory: admin-ui
        run: |
          npm install -g npm@10.9.2
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run build

      - name: Build
        run: go build -o /dev/null ./cmd/

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: OpenAPI spec check
        run: python3 scripts/openapi/check.py

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "not gofmt'd:"; echo "$unformatted"; exit 1; fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Start MongoDB (single-node replica set)
        # Started as a plain container here, not a `services:` entry above
        # like postgres/redis/qdrant: GitHub Actions' services block has no
        # way to override a service container's command, and multi-document
        # transactions (session.WithTransaction -- see internal/state/mongo/
        # mongo.go's UpsertAgent/PublishRegistryEntry/DeleteRegistryEntry)
        # require mongod to be started with --replSet in the first place, a
        # standalone mongod rejects them outright. Same replica-set-of-one
        # setup as docker-compose.test.yml's mongo service -- see that
        # file's mongo service comment for the full rationale (including
        # why the connection string below needs directConnection=true).
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          timeout 60 bash -c 'until docker exec mongo mongosh --quiet --eval "db.runCommand(\"ping\").ok" 2>/dev/null | grep -q 1; do sleep 1; done'
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          timeout 60 bash -c 'until docker exec mongo mongosh --quiet --eval "rs.status().ok" 2>/dev/null | grep -q 1; do sleep 1; done'

      - name: Test (all backends)
        env:
          POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
          MYSQL_DSN: "runkite:runkite@tcp(127.0.0.1:3306)/runkite_test?parseTime=true"
          REDIS_URL: redis://localhost:6379
          MONGO_URI: "mongodb://localhost:27017/?replicaSet=rs0&directConnection=true"
          QDRANT_URL: http://localhost:6333
        # -p 1: see Makefile's test-all comment -- internal/api/vectors_test
        # and internal/vectorstore/pgvector both DROP vector_items against
        # the same shared Postgres test database. ./cmd/... included so
        # the initStore/db-upgrade/db-reset backend-selection wiring
        # (cmd/store_selection_test.go) actually runs in CI, not just the
        # internal/state/mysql package's own conformance suite in
        # isolation -- serve wiring and conformance testing are two
        # separate things that can each be individually forgotten.
        # runner-protocol/tests validates committed examples/*.json fixtures
        # (schema/lifecycle invariants) -- no Docker, PR-gate cheap.
        run: go test ./internal/... ./cmd/... ./runner-protocol/tests/ -race -count=1 -v -p 1

      - name: Python runner unit tests
        env:
          PYTHONPATH: python
        run: |
          python python/tests/test_store_dual_mode.py
          python python/tests/test_store_pool.py
          python python/tests/test_store_batch_cross_loop.py
          python python/tests/test_store_pool_recreate.py
          python python/tests/test_checkpoint_pool_recreate.py
          python python/tests/test_vectorstore_cross_loop.py
          python python/tests/test_custom_app.py
          python python/tests/test_custom_auth.py
          python python/tests/test_factory_graph.py
          # Live dual-mode interop portion skips without RUNKITE_HTTP_URL
          # set (same as test_store_dual_mode.py above) -- no live control
          # plane is started for this step; the live path is verified
          # manually the same way store.py's and cron's are.
          python python/tests/test_vectorstore_dual_mode.py
          python python/tests/test_generic_worker.py
          python python/tests/test_langchain_adapter.py
          python python/tests/test_worker_cancel_race.py
          python python/tests/test_run_status.py
          python python/tests/test_worker_concurrency.py
          python python/tests/test_tool_call_hook.py
          python python/tests/test_a2a.py

      - name: CrewAI/LlamaIndex/AutoGen adapter unit tests
        # Isolated venvs, deliberately NOT installed into the shared
        # python/requirements.txt environment above -- see
        # python/adapters/*/README.md for why (a stray `pip install
        # crewai` there downgraded protobuf during development).
        run: |
          pip install uv
          # httpx is required by runkite_runner.run_status (pre-exec status
          # check imported via generic_worker) -- declare it explicitly so
          # adapters don't depend on a transitive pull from the framework
          # package (autogen-agentchat does not ship httpx; crewai/llama
          # only do today by accident).
          uv venv --python 3.12 python/adapters/crewai_adapter/.venv
          uv pip install --python python/adapters/crewai_adapter/.venv/bin/python crewai grpcio protobuf httpx
          PYTHONPATH=python:python/adapters python/adapters/crewai_adapter/.venv/bin/python python/adapters/crewai_adapter/test_adapter.py

          uv venv --python 3.12 python/adapters/llamaindex_adapter/.venv
          uv pip install --python python/adapters/llamaindex_adapter/.venv/bin/python llama-index-core grpcio protobuf httpx
          PYTHONPATH=python:python/adapters python/adapters/llamaindex_adapter/.venv/bin/python python/adapters/llamaindex_adapter/test_adapter.py

          uv venv --python 3.12 python/adapters/autogen_adapter/.venv
          uv pip install --python python/adapters/autogen_adapter/.venv/bin/python autogen-agentchat grpcio protobuf httpx
          PYTHONPATH=python:python/adapters python/adapters/autogen_adapter/.venv/bin/python python/adapters/autogen_adapter/test_adapter.py

      - name: TypeScript runner lint + format check
        working-directory: typescript/runkite-runner
        run: |
          npm install
          npm audit --audit-level=high
          npm run lint
          npm run format:check

      - name: TypeScript runner unit tests
        working-directory: typescript/runkite-runner
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsx --test src/*.test.ts

      - name: TypeScript runner dist/ is in sync with src/
        # Unit tests above run against src/ directly via tsx, never touching
        # dist/ -- the actual npm-published, `bin`/`main`-referenced build
        # output -- so a stale, uncommitted-after-editing dist/ (once found:
        # unbuilt since the initial commit, missing entire files added in
        # later TS-parity passes) can drift silently forever without this
        # check. Rebuild for real and fail if the committed dist/ doesn't
        # match -- catches "forgot to run npm run build before committing"
        # the same day it happens instead of leaving installed packages
        # stale indefinitely.
        working-directory: typescript/runkite-runner
        run: |
          npm run build
          git diff --exit-code -- dist/

      - name: E2E (real binary + real Python/LangChain-adapter runners + real Postgres/Redis)
        # Tier-0 only: ./test/e2e + ./test/e2e/adapters (LangChain e2e
        # cancel path). The framework × backend matrix lives in
        # ./test/e2e/matrix and runs nightly / on demand via
        # .github/workflows/matrix.yml (`make test-matrix`), not on every PR.
        env:
          POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: go test ./test/e2e/ ./test/e2e/adapters/... -v -timeout 120s -count=1

  # Validates every workflow file's YAML *and* GitHub Actions expression
  # semantics (e.g. `secrets` is not a valid context in `if:` -- a step-level
  # `if: secrets.X != ''` passes plain YAML parsing but fails GitHub's own
  # workflow validator at push time with zero jobs run and no per-job log to
  # point at the cause). Confirmed live: this exact mistake shipped twice in
  # release.yml's npm job before being caught, silently breaking the entire
  # release workflow (goreleaser/docker/pypi too, not just npm) since one
  # invalid `if:` fails validation for the whole file. actionlint catches it
  # here, on every push/PR, before it ever reaches a real tag push.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflow files
        run: "$(go env GOPATH)/bin/actionlint"

  # Separate job so a base-image CVE can't mask the main test suite.
  # Uses the Trivy container (not trivy-action) pinned by tag after the
  # 2026 trivy-action supply-chain incident -- avoid floating @master.
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build control-plane image
        run: docker build -t runkite:ci -f Dockerfile .

      - name: Trivy vulnerability scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            runkite:ci

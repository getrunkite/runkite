name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    needs: [test-suite, admin-audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require full test suite and Admin audit
        env:
          TEST_SUITE_RESULT: ${{ needs.test-suite.result }}
          ADMIN_AUDIT_RESULT: ${{ needs.admin-audit.result }}
        run: |
          if [ "$TEST_SUITE_RESULT" != "success" ] || [ "$ADMIN_AUDIT_RESULT" != "success" ]; then
            printf 'Required jobs did not both succeed: test-suite=%s admin-audit=%s\n' "$TEST_SUITE_RESULT" "$ADMIN_AUDIT_RESULT"
            exit 1
          fi

  admin-audit:
    name: Admin dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Test npm audit policy
        run: python3 -m unittest discover -s python/tests -p test_npm_audit_policy.py -v

      - name: Audit Admin dependencies
        working-directory: admin-ui
        run: |
          npm install -g npm@10.9.2
          npm ci
          # Fail on real high/critical findings; warn-only if the audit
          # API/registry is down (see scripts/npm-audit-ci.sh).
          bash ../scripts/npm-audit-ci.sh

  test-suite:
    name: Full test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector:pg16 (drop-in postgres:16 + pgvector extension
        # binary) so the vector store test suite (internal/vectorstore/pgvector)
        # can run in CI, not just against a developer's local docker-compose.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: runkite
          POSTGRES_PASSWORD: runkite
          POSTGRES_DB: runkite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runkite -d runkite_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

      mysql:
        # The second SQL exemplar alongside Postgres/SQLite
        # (internal/state/mysql) -- same conformance suite, so this
        # needs to run in CI too, not just locally. Unlike mongo below,
        # MySQL's default command needs no override for this project's
        # purposes, so a normal `services:` entry (not a manual `docker
        # run` step) is sufficient.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: runkite
          MYSQL_USER: runkite
          MYSQL_PASSWORD: runkite
          MYSQL_DATABASE: runkite_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -prunkite"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

      qdrant:
        # The non-SQL exemplar vectorstore.VectorStore backend
        # (internal/vectorstore/qdrant) -- same conformance suite as
        # pgvector, so this needs to run in CI too, not just locally.
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check public documentation links
        run: python3 scripts/check-doc-links.py

      - name: Check coordinated release metadata
        run: |
          python3 -m unittest discover -s python/tests -p test_release_version.py
          python3 scripts/check-release-version.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Test public site interactions
        run: make test-site

      - name: Install Python runner dependencies
        run: pip install -r python/requirements.txt

      - name: Python lint (ruff)
        run: |
          pip install -r python/requirements-dev.txt
          ruff check python/ python/adapters/
          ruff format --check python/ python/adapters/

      - name: Install example custom-app dependencies
        # fastapi is the example custom_routes_agent app's own framework
        # choice, not a runkite_runner dependency (uvicorn alone, already in
        # requirements.txt, is all the SDK needs to serve any ASGI app) --
        # installed separately so CI actually exercises test_custom_app.py
        # instead of it silently skipping.
        run: pip install fastapi

      - name: Admin UI - install, lint, test, typecheck, build
        # Builds straight into internal/adminui/dist (see admin-ui/vite.config.ts),
        # so the Go build step right after this actually exercises a fresh
        # bundle instead of whatever was last committed.
        # Pin npm 10 to match packageManager / engines -- local npm 11
        # rewrites lockfile keys CI's npm 10 cannot resolve (@emnapi/*).
        working-directory: admin-ui
        run: |
          npm install -g npm@10.9.2
          npm ci
          npm run lint
          # Plain node --test with native TS type-stripping (no extra
          # devDependency) -- see src/lib/agentMessages.test.ts.
          npm test
          npm run build

      - name: Build
        run: go build -o /dev/null ./cmd/

      - name: Vet
        run: go vet ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: OpenAPI spec check
        run: |
          python3 scripts/openapi/build.py
          python3 scripts/openapi/check.py
          git diff --exit-code -- spec/

      - name: Gofmt
        run: |
          # xargs -0 avoids SC2046 word-splitting on paths from git ls-files
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then echo "not gofmt'd:"; echo "$unformatted"; exit 1; fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

      - name: Start MongoDB (single-node replica set)
        # Started as a plain container here, not a `services:` entry above
        # like postgres/redis/qdrant: GitHub Actions' services block has no
        # way to override a service container's command, and multi-document
        # transactions (session.WithTransaction -- see internal/state/mongo/
        # mongo.go's UpsertAgent/PublishRegistryEntry/DeleteRegistryEntry)
        # require mongod to be started with --replSet in the first place, a
        # standalone mongod rejects them outright. Same replica-set-of-one
        # setup as docker-compose.test.yml's mongo service -- see that
        # file's mongo service comment for the full rationale (including
        # why the connection string below needs directConnection=true).
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          timeout 60 bash -c 'until docker exec mongo mongosh --quiet --eval "db.runCommand(\"ping\").ok" 2>/dev/null | grep -q 1; do sleep 1; done'
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          timeout 60 bash -c 'until docker exec mongo mongosh --quiet --eval "rs.status().ok" 2>/dev/null | grep -q 1; do sleep 1; done'

      - name: Test (all backends)
        env:
          POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
          MYSQL_DSN: "runkite:runkite@tcp(127.0.0.1:3306)/runkite_test?parseTime=true"
          REDIS_URL: redis://localhost:6379
          MONGO_URI: "mongodb://localhost:27017/?replicaSet=rs0&directConnection=true"
          QDRANT_URL: http://localhost:6333
        # -p 1: see Makefile's test-all comment -- internal/api/vectors_test
        # and internal/vectorstore/pgvector both DROP vector_items against
        # the same shared Postgres test database. ./cmd/... included so
        # the initStore/db-upgrade/db-reset backend-selection wiring
        # (cmd/store_selection_test.go) actually runs in CI, not just the
        # internal/state/mysql package's own conformance suite in
        # isolation -- serve wiring and conformance testing are two
        # separate things that can each be individually forgotten.
        run: go test ./internal/... ./cmd/... -race -count=1 -v -p 1

      - name: Stream recovery across reclaim (Postgres + Redis)
        env:
          STREAM_RECOVERY_POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
          # DB 13: keep reclaim fixtures off the shared suite's DB0 leftovers.
          STREAM_RECOVERY_REDIS_URL: redis://localhost:6379/13
        run: go test ./internal/api/ -run '^TestStreamRecovery' -race -count=1 -timeout 120s

      - name: JSON number integrity (Postgres + Redis)
        env:
          JSON_NUMBERS_POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
          # DB 14: isolate cache/dequeue identity from stream-recovery leftovers.
          JSON_NUMBERS_REDIS_URL: redis://localhost:6379/14
        run: go test ./internal/api/ -run '^TestJSONNumbers' -race -count=1 -timeout 120s

      # Separate module (runner-protocol/go.mod). Schema/lifecycle fixtures —
      # no Docker, PR-gate cheap.
      - name: Runner protocol fixtures
        run: cd runner-protocol && go test ./... -count=1 -v

      # Named so governance announce-bar coverage cannot disappear via a silent
      # rename/Skip of TestGovernanceAnnounceBar inside the broad suite above.
      - name: Governance announce bar (Postgres)
        env:
          POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
        run: go test ./internal/api/ -run '^TestGovernanceAnnounceBar$' -race -count=1 -timeout 120s

      - name: Python runner unit tests
        env:
          PYTHONPATH: python
        run: |
          python python/tests/test_store_dual_mode.py
          python python/tests/test_store_pool.py
          python python/tests/test_store_batch_cross_loop.py
          python python/tests/test_store_pool_recreate.py
          python python/tests/test_checkpoint_pool_recreate.py
          python python/tests/test_vectorstore_cross_loop.py
          python python/tests/test_custom_app.py
          python python/tests/test_custom_auth.py
          python python/tests/test_factory_graph.py
          # Live dual-mode interop portion skips without RUNKITE_HTTP_URL
          # set (same as test_store_dual_mode.py above) -- no live control
          # plane is started for this step; the live path is verified
          # manually the same way store.py's and cron's are.
          python python/tests/test_vectorstore_dual_mode.py
          python python/tests/test_generic_worker.py
          python python/tests/test_langchain_adapter.py
          python python/tests/test_worker_cancel_race.py
          python python/tests/test_run_status.py
          python -m unittest discover -s python/tests -p test_execution_pool.py
          python -m unittest discover -s python/tests -p test_isolated.py
          python -m unittest discover -s python/tests -p test_isolated_usage.py
          python -m unittest discover -s python/tests -p test_isolated_fixture.py
          python -m unittest discover -s python/tests -p test_runner_image_qualification.py
          python -m unittest discover -s python/tests -p test_assignment_identity.py
          python python/tests/test_completion.py
          python python/tests/test_worker_completion.py
          python python/tests/test_worker_concurrency.py
          python python/tests/test_tool_call_hook.py
          python python/tests/test_a2a.py
          python python/tests/test_adapter_checkpoints.py
          python python/tests/test_usage_accumulate.py
          python python/tests/test_protocol_execute_goldens.py
          python python/tests/test_heartbeat.py
          python python/tests/test_logging_config.py
          python python/tests/test_tls_utils.py
          python python/tests/test_schema_introspect.py
          python python/tests/test_tenant_ctx.py
          python python/tests/test_run_identity_headers.py
          python python/tests/test_checkpoint_identity.py
          python python/tests/test_connectors.py
          python python/tests/test_tracing.py
          python python/tests/test_otel_callbacks.py
          python python/tests/test_checkpoint_concurrent_setup.py
          python python/tests/test_proxy_checkpoint.py
          python python/tests/test_governance.py
          # Live LangGraph SDK tests skip cleanly when /health is down (no
          # control plane in this step). They run for real when
          # RUNKITE_URL points at a live stack.
          python tests/sdk_client_test.py
          python tests/sdk_e2e_test.py
          python tests/sdk_cancel_hitl_test.py

      - name: Framework adapter unit tests in isolated SDK environments
        # Isolated venvs, deliberately NOT installed into the shared
        # python/requirements.txt environment above -- see
        # python/adapters/*/README.md for why (a stray `pip install
        # crewai` there downgraded protobuf during development).
        run: |
          pip install uv
          # httpx is required by runkite_runner.run_status (pre-exec status
          # check imported via generic_worker) -- declare it explicitly so
          # adapters don't depend on a transitive pull from the framework
          # package (autogen-agentchat does not ship httpx; crewai/llama
          # only do today by accident).
          uv venv --python 3.12 python/adapters/crewai_adapter/.venv
          uv pip install --python python/adapters/crewai_adapter/.venv/bin/python crewai grpcio protobuf httpx
          PYTHONPATH=python:python/adapters python/adapters/crewai_adapter/.venv/bin/python python/adapters/crewai_adapter/test_adapter.py

          uv venv --python 3.12 python/adapters/llamaindex_adapter/.venv
          uv pip install --python python/adapters/llamaindex_adapter/.venv/bin/python llama-index-core grpcio protobuf httpx
          PYTHONPATH=python:python/adapters python/adapters/llamaindex_adapter/.venv/bin/python python/adapters/llamaindex_adapter/test_adapter.py

          uv venv --python 3.12 python/adapters/autogen_adapter/.venv
          uv pip install --python python/adapters/autogen_adapter/.venv/bin/python autogen-agentchat grpcio protobuf httpx
          PYTHONPATH=python:python/adapters python/adapters/autogen_adapter/.venv/bin/python python/adapters/autogen_adapter/test_adapter.py

          uv venv --python 3.12 python/adapters/agent_framework_adapter/.venv
          uv pip install --python python/adapters/agent_framework_adapter/.venv/bin/python 'agent-framework-core==1.23.0' 'agent-framework-openai==1.17.0' grpcio protobuf httpx
          PYTHONPATH=python:python/adapters:examples/managed_agent_framework python/adapters/agent_framework_adapter/.venv/bin/python -m unittest discover -s python/adapters/agent_framework_adapter -p 'test_*.py'

          uv venv --python 3.12 python/adapters/openai_agents_adapter/.venv
          uv pip install --python python/adapters/openai_agents_adapter/.venv/bin/python 'openai-agents==0.24.0' grpcio protobuf httpx
          PYTHONPATH=python:python/adapters:examples/managed_openai_agents python/adapters/openai_agents_adapter/.venv/bin/python -m unittest discover -s python/adapters/openai_agents_adapter -p 'test_*.py'

          uv venv --python 3.12 python/adapters/pydantic_ai_adapter/.venv
          uv pip install --python python/adapters/pydantic_ai_adapter/.venv/bin/python 'pydantic-ai-slim[openai]==2.63.0' grpcio protobuf httpx
          PYTHONPATH=python:python/adapters:examples/managed_pydantic_ai python/adapters/pydantic_ai_adapter/.venv/bin/python -m unittest discover -s python/adapters/pydantic_ai_adapter -p 'test_*.py'

          uv venv --python 3.12 python/adapters/google_adk_adapter/.venv
          uv pip install --python python/adapters/google_adk_adapter/.venv/bin/python 'google-adk==2.13.0' grpcio protobuf httpx
          PYTHONPATH=python:python/adapters:examples/managed_google_adk python/adapters/google_adk_adapter/.venv/bin/python -m unittest discover -s python/adapters/google_adk_adapter -p 'test_*.py'

      - name: Python sdist and wheel artifact contract
        run: make test-python-package

      - name: Shared managed chat UI bridge - prepare and test
        run: make test-managed-chat-ui

      - name: Managed Microsoft runner with real plane and installed wheel (SQLite)
        env:
          RUNKITE_TEST_CHAT_BRIDGE: "1"
        run: make test-managed-agent-framework

      - name: Managed Microsoft runner with real plane and installed wheel (Postgres + Redis)
        env:
          RUNKITE_TEST_CHAT_BRIDGE: "1"
          RUNKITE_TEST_POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
          RUNKITE_TEST_REDIS_URL: redis://localhost:6379
        run: make test-managed-agent-framework

      - name: Managed OpenAI Agents runner with real plane and installed wheel (SQLite)
        env:
          RUNKITE_TEST_CHAT_BRIDGE: "1"
        run: make test-managed-openai-agents

      - name: Managed OpenAI Agents runner with real plane and installed wheel (Postgres + Redis)
        env:
          RUNKITE_TEST_CHAT_BRIDGE: "1"
          RUNKITE_TEST_POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
          RUNKITE_TEST_REDIS_URL: redis://localhost:6379
        run: make test-managed-openai-agents

      - name: Managed Pydantic AI runner with real plane and installed wheel (SQLite)
        env:
          RUNKITE_TEST_CHAT_BRIDGE: "1"
        run: make test-managed-pydantic-ai

      - name: Managed Pydantic AI runner with real plane and installed wheel (Postgres + Redis)
        env:
          RUNKITE_TEST_CHAT_BRIDGE: "1"
          RUNKITE_TEST_POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
          RUNKITE_TEST_REDIS_URL: redis://localhost:6379
        run: make test-managed-pydantic-ai

      - name: Managed Google ADK runner with real plane and installed wheel (SQLite)
        env:
          RUNKITE_TEST_CHAT_BRIDGE: "1"
        run: make test-managed-google-adk

      - name: Managed Google ADK runner with real plane and installed wheel (Postgres + Redis)
        env:
          RUNKITE_TEST_CHAT_BRIDGE: "1"
          RUNKITE_TEST_POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
          RUNKITE_TEST_REDIS_URL: redis://localhost:6379
        run: make test-managed-google-adk

      - name: TypeScript runner lint + format check
        working-directory: typescript/runkite-runner
        run: |
          npm install
          bash ../../scripts/npm-audit-ci.sh
          npm run lint
          npm run format:check

      - name: TypeScript runner unit tests
        working-directory: typescript/runkite-runner
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsx --test src/*.test.ts

      - name: Managed AI SDK runner and UI bridge (offline model)
        run: make test-managed-ai-sdk

      - name: TypeScript governance helper
        working-directory: typescript/runkite-governance
        run: |
          npm ci
          npm run build
          npm test

      - name: AI SDK governance integration (offline)
        working-directory: examples/governance_ai_sdk
        run: |
          npm ci
          npm run check
          npm test

      - name: Microsoft Agent Framework governance integration (offline model)
        run: |
          make test-governance-agent-framework
          ruff check examples/governance_agent_framework
          ruff format --check examples/governance_agent_framework

      - name: Governance installed artifact contracts and release recovery checks
        run: |
          python scripts/test_release_artifacts.py -v
          examples/governance_agent_framework/.venv/bin/python -m pip install -r python/requirements-build.txt
          RUNKITE_GOVERNANCE_FRAMEWORK_PYTHON="$PWD/examples/governance_agent_framework/.venv/bin/python" \
            examples/governance_agent_framework/.venv/bin/python python/tests/test_governance_package_artifacts.py -v
          python scripts/release_artifacts.py build npm typescript/runkite-governance "$RUNNER_TEMP/governance-npm-artifacts"
          node scripts/verify_governance_npm.mjs "$RUNNER_TEMP/governance-npm-artifacts/runkite-governance-$(cat VERSION).tgz"

      - name: TypeScript runner dist/ is in sync with src/
        # Unit tests above run against src/ directly via tsx, never touching
        # dist/ -- the actual npm-published, `bin`/`main`-referenced build
        # output -- so a stale, uncommitted-after-editing dist/ (once found:
        # unbuilt since the initial commit, missing entire files added in
        # later TS-parity passes) can drift silently forever without this
        # check. Rebuild for real and fail if the committed dist/ doesn't
        # match -- catches "forgot to run npm run build before committing"
        # the same day it happens instead of leaving installed packages
        # stale indefinitely.
        working-directory: typescript/runkite-runner
        run: |
          npm run build
          # Stage dist/ so brand-new untracked files (e.g. a freshly added
          # proxyCheckpoint.js) fail the check too — plain `git diff` only
          # sees changes to already-tracked paths and would miss a forgotten
          # `git add` of a new build artifact.
          git add -A dist/
          git diff --cached --exit-code -- dist/

      - name: E2E (real binary + real Python/LangChain-adapter runners + real Postgres/Redis)
        # Tier-0 only: ./test/e2e + ./test/e2e/adapters (LangChain e2e
        # cancel path). The framework × backend matrix lives in
        # ./test/e2e/matrix and runs nightly / on demand via
        # .github/workflows/matrix.yml (`make test-matrix`), not on every PR.
        env:
          POSTGRES_DSN: postgres://runkite:runkite@localhost:5432/runkite_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: go test ./test/e2e/ ./test/e2e/adapters/... -v -timeout 120s -count=1

  # Exercise the actual release client before tagging, without publication authority.
  publish-tools:
    name: Publication tool contracts (npm 12)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install the release npm client
        run: |
          npm install --global npm@12.2.2
          node --version
          npm --version
      - name: Test artifact parsing and immutable recovery guards
        run: |
          python scripts/test_release_artifacts.py -v
          python scripts/test_prepare_release_recovery.py -v
      - name: Install locked runner dependencies
        working-directory: typescript/runkite-runner
        run: npm ci
      - name: Build and pack runner with the release pipeline
        id: runner_artifact
        env:
          PACKAGE_DIR: typescript/runkite-runner
          ARTIFACT_DIR: ${{ runner.temp }}/publish-tools-runkite-runner
        run: python scripts/release_artifacts.py build npm "$PACKAGE_DIR" "$ARTIFACT_DIR"
      - name: Install locked governance dependencies
        working-directory: typescript/runkite-governance
        run: npm ci
      - name: Build and pack governance with the release pipeline
        id: governance_artifact
        env:
          PACKAGE_DIR: typescript/runkite-governance
          ARTIFACT_DIR: ${{ runner.temp }}/publish-tools-runkite-governance
        run: python scripts/release_artifacts.py build npm "$PACKAGE_DIR" "$ARTIFACT_DIR"
      - name: Install locked offline AI SDK fixture dependencies
        working-directory: examples/governance_ai_sdk
        run: npm ci
      - name: Verify the installed governance tarball and native AI SDK behavior
        env:
          TARBALL: ${{ steps.governance_artifact.outputs.artifact_path }}
        run: node scripts/verify_governance_npm.mjs "$TARBALL"

  # Cheap chart render only — no kind/cluster. Catches values-supported /
  # values-tls overlays and tls.validate fail-closed paths breaking template.
  helm-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4
      - name: helm template (Supported overlay)
        run: |
          helm template runkite ./deploy/helm/runkite \
            -f deploy/helm/runkite/values.yaml \
            -f deploy/helm/runkite/values-supported.yaml \
            --set secrets.postgresDsn=postgres://x \
            --set secrets.redisUrl=redis://x \
            --set secrets.runnerToken=t \
            --set secrets.apiKey=k \
            >/dev/null
      - name: helm template (Supported + TLS overlay)
        run: |
          helm template runkite ./deploy/helm/runkite \
            -f deploy/helm/runkite/values.yaml \
            -f deploy/helm/runkite/values-supported.yaml \
            -f deploy/helm/runkite/values-tls.yaml \
            --set secrets.postgresDsn=postgres://x \
            --set secrets.redisUrl=redis://x \
            --set secrets.runnerToken=t \
            --set secrets.apiKey=k \
            >/dev/null

  # Validates every workflow file's YAML *and* GitHub Actions expression
  # semantics (e.g. `secrets` is not a valid context in `if:` -- a step-level
  # `if: secrets.X != ''` passes plain YAML parsing but fails GitHub's own
  # workflow validator at push time with zero jobs run and no per-job log to
  # point at the cause). Confirmed live: this exact mistake shipped twice in
  # release.yml's npm job before being caught, silently breaking the entire
  # release workflow (goreleaser/docker/pypi too, not just npm) since one
  # invalid `if:` fails validation for the whole file. actionlint catches it
  # here, on every push/PR, before it ever reaches a real tag push.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint workflow files
        run: actionlint

  # Separate job so a base-image CVE can't mask the main test suite.
  # Uses the Trivy container (not trivy-action) pinned by tag after the
  # 2026 trivy-action supply-chain incident -- avoid floating @master.
  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-plane
            dockerfile: Dockerfile
          - image: python-runner
            dockerfile: Dockerfile.runner
          - image: typescript-runner
            dockerfile: Dockerfile.runner-ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build ${{ matrix.image }} image
        run: docker build -t runkite:ci -f "${{ matrix.dockerfile }}" .

      - name: Smoke control-plane image
        if: matrix.image == 'control-plane'
        run: docker run --rm runkite:ci version

      - name: Smoke Python runner image
        if: matrix.image == 'python-runner'
        run: |
          docker run --rm --entrypoint sh runkite:ci -c \
            'test "$(id -u)" = 65532 && runkite-runner --help && runkite-runner-isolated --help'

      - name: Qualify TypeScript runtime image
        if: matrix.image == 'typescript-runner'
        env:
          RUNKITE_TEST_RUNNER_IMAGE: "1"
        run: python3 scripts/qualify-runner-image.py --image runkite:ci --output runner-image-qualification.json

      - name: Trivy vulnerability scan
        run: |
          set -euo pipefail
          # Docker Hub can return 502 while pulling the pinned scanner.
          # Retry the pull only. A real vulnerability finding still fails once.
          for attempt in 1 2 3; do
            if docker pull aquasec/trivy:0.72.0; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "trivy image pull failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "trivy image pull failed (attempt ${attempt}); retrying" >&2
            sleep $((attempt * 10))
          done
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            runkite:ci

  # Qualify both supported Node lines with the actual installed package.
  # A source-only suite missed a built-in fetch/Undici dispatcher mismatch.
  packaged-mtls:
    name: Packaged mTLS (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "26.11.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/runkite-runner/package-lock.json

      - name: Build the actual control-plane binary
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runkite-packaged-mtls"
          go build -trimpath -o "$RUNNER_TEMP/runkite-packaged-mtls/runkite" ./cmd

      - name: Install locked dependencies and build the runner package
        working-directory: typescript/runkite-runner
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Test packaged strict mTLS without an optional skip
        working-directory: typescript/runkite-runner
        timeout-minutes: 5
        shell: bash
        env:
          RUNKITE_TEST_WORKLOAD_BINARY: ${{ runner.temp }}/runkite-packaged-mtls/runkite
          RUNKITE_TEST_WORKLOAD_OUTPUT: ${{ runner.temp }}/runkite-packaged-mtls/result.json
          EXPECTED_NODE_VERSION: ${{ matrix.node }}
        run: |
          set -euo pipefail
          test -x "$RUNKITE_TEST_WORKLOAD_BINARY"
          node --import tsx --test src/workloadIdentity.e2e.test.ts
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile(process.env.RUNKITE_TEST_WORKLOAD_OUTPUT, "utf8"));
          assert.equal(process.version, "v" + process.env.EXPECTED_NODE_VERSION);
          assert.equal(report.node, process.version);
          assert.equal(report.passed, true, "Packaged strict mTLS did not pass.");
          assert.equal(report.cases?.length, 4, "All four real package cases must execute.");
          NODE

      - name: Retain only synthetic qualification reports and process logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-mtls-node-${{ matrix.node }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runkite-packaged-mtls/result.json
            ${{ runner.temp }}/runkite-packaged-mtls/result.json.plane.log
            ${{ runner.temp }}/runkite-packaged-mtls/result.json.runner.log
          if-no-files-found: error
          retention-days: 7

name: OpenShell effective-policy qualification

on:
  pull_request:
    paths:
      - scripts/qualify-isolated.py
      - scripts/isolated_policy_qualification.py
      - scripts/start-isolated-fixture.py
      - scripts/review-ha-supervisor.py
      - python/runkite_runner/isolated.py
      - python/runkite_runner/isolated_usage.py
      - python/tests/test_isolated*.py
      - python/tests/test_openshell_prover_native.py
      - examples/isolated_agent/**
      - .github/workflows/openshell-policy.yml
  push:
    branches: [main]
    paths:
      - scripts/qualify-isolated.py
      - scripts/isolated_policy_qualification.py
      - scripts/start-isolated-fixture.py
      - scripts/review-ha-supervisor.py
      - python/runkite_runner/isolated.py
      - python/runkite_runner/isolated_usage.py
      - python/tests/test_isolated*.py
      - python/tests/test_openshell_prover_native.py
      - examples/isolated_agent/**
      - .github/workflows/openshell-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUNKITE_TEST_ISOLATED: "1"
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Prepare an owned Linux fixture
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          echo "QUALIFICATION_OUTPUT=$RUNNER_TEMP/openshell-policy" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/openshell-policy/bin" "$RUNNER_TEMP/openshell-policy/runtime"
          docker compose version
          docker version --format '{{.Server.Version}}' > "$RUNNER_TEMP/openshell-policy/docker-version.txt"
          uname -sr > "$RUNNER_TEMP/openshell-policy/kernel.txt"
          python3 - "$RUNNER_TEMP/openshell-policy" <<'PY'
          import ctypes, re, sys
          from pathlib import Path
          output = Path(sys.argv[1])
          version = (output / "docker-version.txt").read_text().strip()
          match = re.match(r"^(\d+)\.", version)
          if not match or int(match[1]) < 28:
              raise SystemExit("This profile requires Docker Engine 28 or newer.")
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          abi = libc.syscall(444, 0, 0, 1)
          if abi < 1:
              raise SystemExit("Landlock is unavailable; qualification cannot pass by skipping it.")
          (output / "landlock-abi.txt").write_text(str(abi) + "\n")
          PY
      - name: Install the existing runner dependencies and verified release tools
        run: |
          set -euo pipefail
          python -m pip install -r python/requirements.txt
          for name in openshell openshell-prover; do
            archive="$name-x86_64-unknown-linux-musl.tar.gz"
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
              --connect-timeout 10 --max-time 120 \
              "https://github.com/NVIDIA/OpenShell/releases/download/v0.1.8/$archive" \
              --output "$QUALIFICATION_OUTPUT/bin/$archive"
          done
          printf '%s  %s\n' \
            87f5c41d396dcd36b4c30a7b5e6f41643a656cb31a82b0edbb00319c9a719c2d \
            "$QUALIFICATION_OUTPUT/bin/openshell-x86_64-unknown-linux-musl.tar.gz" \
            34123490c9934857089753e986d6173500542d67ed295b38772c9b67f25fe068 \
            "$QUALIFICATION_OUTPUT/bin/openshell-prover-x86_64-unknown-linux-musl.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$QUALIFICATION_OUTPUT/bin/openshell-x86_64-unknown-linux-musl.tar.gz" -C "$QUALIFICATION_OUTPUT/bin" -- openshell
          tar -xzf "$QUALIFICATION_OUTPUT/bin/openshell-prover-x86_64-unknown-linux-musl.tar.gz" -C "$QUALIFICATION_OUTPUT/bin" -- openshell-prover
          echo "RUNKITE_TEST_OPENSHELL_PROVER=$QUALIFICATION_OUTPUT/bin/openshell-prover" >> "$GITHUB_ENV"
      - name: Offline snapshot, launch-order and cleanup regressions
        run: |
          python -m unittest discover -s python/tests -p 'test_isolated_policy*.py' -v
          python -m unittest discover -s python/tests -p test_isolated.py
          python -m unittest discover -s python/tests -p test_isolated_fixture.py
      - name: Actual checker positive, negative, invalid and unsupported controls
        env:
          RUNKITE_TEST_OPENSHELL_PROVER_REPORT: ${{ runner.temp }}/openshell-policy/prover-controls.json
        run: python -m unittest discover -s python/tests -p test_openshell_prover_native.py -v
      - name: Effective and loaded policy around real confined workload execution
        run: |
          timeout --signal=TERM --kill-after=90s 600 \
            python scripts/start-isolated-fixture.py \
              --cli "$QUALIFICATION_OUTPUT/bin/openshell" \
              --output-dir "$QUALIFICATION_OUTPUT/runtime" --tls -- \
              python -c 'import os, sys;
          os.execv(sys.executable, [
              sys.executable, "scripts/qualify-isolated.py",
              "--cli", os.environ["RUNKITE_TEST_ISOLATED_CLI"],
              "--gateway", os.environ["RUNKITE_TEST_ISOLATED_GATEWAY"],
              "--image", os.environ["RUNKITE_TEST_ISOLATED_IMAGE"],
              "--prover", os.environ["RUNKITE_TEST_OPENSHELL_PROVER"],
              "--output", os.path.join(os.environ["QUALIFICATION_OUTPUT"], "runtime/policy-evidence.json")
          ])'
      - name: Require comparison, TLS and confirmed cleanup together
        run: |
          python - "$QUALIFICATION_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          output = Path(sys.argv[1])
          evidence = json.loads((output / "runtime/policy-evidence.json").read_text())
          assert evidence["passed"] is True
          assert evidence["effective_policy"]["passed"] is True
          assert len(evidence["effective_policy"]["attempts"]) == 2
          assert json.loads((output / "runtime/runtime-cleanup.json").read_text())["confirmed"] is True
          assert json.loads((output / "runtime/gateway-tls-evidence.json").read_text())["passed"] is True
          assert len(json.loads((output / "prover-controls.json").read_text())["cases"]) == 4
          PY
      - name: Retain only synthetic summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openshell-policy-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/openshell-policy/prover-controls.json
            ${{ runner.temp }}/openshell-policy/kernel.txt
            ${{ runner.temp }}/openshell-policy/docker-version.txt
            ${{ runner.temp }}/openshell-policy/landlock-abi.txt
            ${{ runner.temp }}/openshell-policy/runtime/policy-evidence.json
            ${{ runner.temp }}/openshell-policy/runtime/runtime-cleanup.json
            ${{ runner.temp }}/openshell-policy/runtime/gateway-tls-evidence.json
            ${{ runner.temp }}/openshell-policy/runtime/runtime-fixture.json

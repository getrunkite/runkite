[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runkite-governance"
version = "0.6.0"
description = "Small decide and pending-action helper for app-owned agent loops."
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agent-framework = ["agent-framework-core==1.23.0"]

[project.urls]
Repository = "https://github.com/getrunkite/runkite"
Documentation = "https://github.com/getrunkite/runkite/blob/main/docs/client-sdk.md"

[tool.setuptools]
packages = ["runkite_governance"]
package-dir = { runkite_governance = "." }

[tool.setuptools.package-data]
runkite_governance = ["py.typed"]

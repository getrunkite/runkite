[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runkite-runner"
version = "0.5.8"
description = "Python runner for Runkite: LangGraph and optional Microsoft Agent Framework, OpenAI Agents and Pydantic AI over Runner Protocol."
readme = "README.md"
license = { text = "BUSL-1.1" }
requires-python = ">=3.11"
authors = [{ name = "Runkite contributors" }]
keywords = ["runkite", "agent-protocol", "langgraph", "grpc", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "grpcio",
  "protobuf",
  "langgraph",
  "langgraph-sdk",
  "langchain-core",
  "langgraph-checkpoint-postgres",
  "psycopg[binary,pool]",
  "httpx",
  "uvicorn",
]

[project.optional-dependencies]
agent-framework = ["agent-framework-core==1.23.0"]
openai-agents = ["openai-agents==0.24.0"]
pydantic-ai = ["pydantic-ai-slim==2.63.0"]
otel = [
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
]

[project.urls]
Homepage = "https://getrunkite.com/"
Repository = "https://github.com/getrunkite/runkite"
Documentation = "https://getrunkite.com/support/"
Changelog = "https://github.com/getrunkite/runkite/blob/main/CHANGELOG.md"
Issues = "https://github.com/getrunkite/runkite/issues"

[project.scripts]
runkite-runner = "runkite_runner.worker:main"
runkite-runner-agent-framework = "agent_framework_adapter.__main__:main"
runkite-runner-openai-agents = "openai_agents_adapter.__main__:main"
runkite-runner-pydantic-ai = "pydantic_ai_adapter.__main__:main"

[tool.setuptools]
# Explicit module selection includes the package initializer without shipping
# checkout-only test modules or live proof fixtures beside the adapter.
py-modules = [
  "agent_framework_adapter.__main__",
  "agent_framework_adapter.adapter",
  "agent_framework_adapter.state",
  "openai_agents_adapter.__main__",
  "openai_agents_adapter.adapter",
  "openai_agents_adapter.state",
  "pydantic_ai_adapter.__main__",
  "pydantic_ai_adapter.adapter",
  "pydantic_ai_adapter.state",
]

[tool.setuptools.package-dir]
agent_framework_adapter = "adapters/agent_framework_adapter"
openai_agents_adapter = "adapters/openai_agents_adapter"
pydantic_ai_adapter = "adapters/pydantic_ai_adapter"

[tool.setuptools.packages.find]
where = ["."]
include = ["runkite_runner*"]

[tool.setuptools.package-data]
runkite_runner = ["py.typed"]

# Ephemeral Postgres + Redis + MongoDB for running conformance tests locally or in CI.
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   make test-all
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres:
    # pgvector/pgvector:pg16 is a drop-in postgres:16 image with the
    # pgvector extension binary available (not enabled by default -- see
    # internal/vectorstore/pgvector's own `CREATE EXTENSION IF NOT
    # EXISTS`). Using it everywhere Postgres is used for tests means the
    # vector store conformance suite runs against the same test infra as
    # everything else, no separate service needed.
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: runkite
      POSTGRES_PASSWORD: runkite
      POSTGRES_DB: runkite_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runkite -d runkite_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /data

  mongo:
    # internal/state/mongo's non-SQL exemplar backend -- same conformance
    # suite as Postgres/SQLite (see internal/state/conformance), so this
    # needs to be part of the standard test infra, not a manually-started
    # side container (a real gap found in review: MONGO_URI wasn't
    # documented anywhere and this service didn't exist here, so `make
    # test-all`/CI silently skipped Mongo conformance entirely).
    #
    # Runs as a single-node replica set (--replSet rs0), not a standalone
    # mongod: multi-document transactions (session.WithTransaction) are
    # only available on a replica set, even a one-member one -- a
    # standalone mongod rejects them outright. This is what makes
    # UpsertAgent/PublishRegistryEntry/DeleteRegistryEntry's real
    # transactions (see mongo.go) possible; before this, those methods
    # had a documented, deliberate non-atomicity gap vs Postgres/SQLite's
    # SQL transactions specifically because of this missing prerequisite.
    #
    # The healthcheck itself performs the one-time `rs.initiate(...)` --
    # idempotent (rs.status() succeeding means it's already done, so a
    # second `up` on an existing volume is a no-op) and self-contained,
    # so no separate init container or startup script is needed. MONGO_URI
    # must include `replicaSet=rs0&directConnection=true` (see Makefile) --
    # directConnection matters here specifically because of Docker's port
    # remapping: the replica set member is registered as `localhost:27017`
    # (the container's own view of itself), but the host reaches this
    # container on the REMAPPED port 27018 below; without directConnection,
    # the driver's normal replica-set topology discovery would try to
    # reconnect to `localhost:27017` after the initial handshake and fail
    # from the host side. directConnection bypasses that discovery and
    # talks to the seed address only -- correct for a test single-node set
    # that exists purely to unlock transactions, not for real HA/failover.
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; db.runCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /data/db

  mysql:
    # internal/state/mysql -- a second SQL exemplar alongside Postgres/
    # SQLite (master plan: "MySQL stays 'future SQL twin if someone
    # needs it'"). Same conformance suite as every other backend.
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: runkite
      MYSQL_USER: runkite
      MYSQL_PASSWORD: runkite
      MYSQL_DATABASE: runkite_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-prunkite"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/mysql

  qdrant:
    # internal/vectorstore/qdrant's non-SQL exemplar vector backend --
    # same conformance suite as pgvector (see internal/vectorstore/conformance).
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /qdrant/storage

# Ephemeral Postgres + Redis + MongoDB for running conformance tests locally or in CI.
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   make test-all
#   docker compose -f docker-compose.test.yml down -v
services:
  postgres:
    # pgvector/pgvector:pg16 is a drop-in postgres:16 image with the
    # pgvector extension binary available (not enabled by default -- see
    # internal/vectorstore/pgvector's own `CREATE EXTENSION IF NOT
    # EXISTS`). Using it everywhere Postgres is used for tests means the
    # vector store conformance suite runs against the same test infra as
    # everything else, no separate service needed.
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: runkite
      POSTGRES_PASSWORD: runkite
      POSTGRES_DB: runkite_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runkite -d runkite_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /data

  mongo:
    # internal/state/mongo's non-SQL exemplar backend -- same conformance
    # suite as Postgres/SQLite (see internal/state/conformance), so this
    # needs to be part of the standard test infra, not a manually-started
    # side container (a real gap found in review: MONGO_URI wasn't
    # documented anywhere and this service didn't exist here, so `make
    # test-all`/CI silently skipped Mongo conformance entirely).
    #
    # Runs as a single-node replica set (--replSet rs0), not a standalone
    # mongod: multi-document transactions (session.WithTransaction) are
    # only available on a replica set, even a one-member one -- a
    # standalone mongod rejects them outright. This is what makes
    # UpsertAgent/PublishRegistryEntry/DeleteRegistryEntry's real
    # transactions (see mongo.go) possible; before this, those methods
    # had a documented, deliberate non-atomicity gap vs Postgres/SQLite's
    # SQL transactions specifically because of this missing prerequisite.
    #
    # The healthcheck itself performs the one-time `rs.initiate(...)` --
    # idempotent (rs.status() succeeding means it's already done, so a
    # second `up` on an existing volume is a no-op) and self-contained,
    # so no separate init container or startup script is needed. MONGO_URI
    # must include `replicaSet=rs0&directConnection=true` (see Makefile) --
    # directConnection matters here specifically because of Docker's port
    # remapping: the replica set member is registered as `localhost:27017`
    # (the container's own view of itself), but the host reaches this
    # container on the REMAPPED port 27018 below; without directConnection,
    # the driver's normal replica-set topology discovery would try to
    # reconnect to `localhost:27017` after the initial handshake and fail
    # from the host side. directConnection bypasses that discovery and
    # talks to the seed address only -- correct for a test single-node set
    # that exists purely to unlock transactions, not for real HA/failover.
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; db.runCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /data/db

  mysql:
    # internal/state/mysql -- a second SQL exemplar alongside Postgres/
    # SQLite, kept around as a future SQL twin if someone needs it.
    # Same conformance suite as every other backend.
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: runkite
      MYSQL_USER: runkite
      MYSQL_PASSWORD: runkite
      MYSQL_DATABASE: runkite_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-prunkite"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/mysql

  qdrant:
    # internal/vectorstore/qdrant's non-SQL exemplar vector backend --
    # same conformance suite as pgvector (see internal/vectorstore/conformance).
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /qdrant/storage

  weaviate:
    # internal/vectorstore/weaviate's fixed-property-schema vector
    # backend -- same conformance suite as pgvector/Qdrant (see
    # internal/vectorstore/conformance). Anonymous access + no
    # vectorizer module: this project always supplies its own
    # embeddings (see the package's own doc comment for why
    # vectorizer=none is load-bearing, not just a default).
    image: semitechnologies/weaviate:latest
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    healthcheck:
      # No bash (or /dev/tcp) in this image, unlike Qdrant's -- confirmed
      # live, the bash-based healthcheck used elsewhere in this file just
      # fails with "bash: not found" here. wget is present and Weaviate
      # has its own dedicated readiness endpoint, which is a more
      # accurate check anyway (server fully initialized, not just a port
      # accepting TCP connections).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/v1/.well-known/ready"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/weaviate

  nats:
    # internal/transport/nats's full JobQueue+EventBroker+CancelBroker
    # triad -- same conformance suite as Redis's own transport (see
    # internal/transport/conformance). Config file (not CLI flags) is
    # needed here specifically for max_payload -- see deploy/nats-server.conf's
    # own comment for why the default is too small for this project's
    # own large-payload conformance test.
    image: nats:latest
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./deploy/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "4222:4222"
    # No healthcheck: confirmed live this image ships nothing to exec a
    # check with either -- same situation as the pinecone service below
    # (not even `sh` or `wget` exist in it). `docker compose up --wait`
    # falls back to waiting for "running" state, which is fine here too.

  pinecone:
    # internal/vectorstore/pinecone's backend, tested against Pinecone
    # Local (Pinecone's own official in-memory emulator -- Pinecone
    # itself has no other self-hosted option) -- same conformance suite
    # as pgvector/Qdrant/Weaviate. Port range 5080-5200 (not just
    # 5080-5090 like Pinecone's own docs example) is load-bearing, not
    # generous-for-no-reason: confirmed live that a tight range runs out
    # of per-index ports partway through a full conformance run (10
    # indexes, one per test, and this package's own tests never delete
    # them -- see its own test file's doc comment for why deletion
    # itself is a bigger, unrelated problem here).
    image: ghcr.io/pinecone-io/pinecone-local:latest
    environment:
      PORT: 5080
      PINECONE_HOST: localhost
    ports:
      - "5080-5200:5080-5200"
    platform: linux/amd64
    # No healthcheck: confirmed live this image ships nothing to exec a
    # check with at all -- not even `sh`, `ls`, `wget`, or `curl` exist
    # in it (a minimal/scratch-style image with just its own binary),
    # unlike every other test-infra service in this file. `docker
    # compose up --wait` (see infra-up in the Makefile) falls back to
    # waiting for "running" state instead of "healthy" here, which is
    # fine in practice -- this is a lightweight in-memory emulator that
    # binds its port almost immediately on startup, not a database with
    # a real spool-up sequence to wait out.

  kafka:
    # internal/transport/kafka's own JobQueue-only backend (see that
    # package's own doc comment for why it doesn't implement the full
    # transport triad the way Redis/NATS do) -- same conformance suite,
    # run via `make test-kafka`.
    #
    # Single-node KRaft mode (no Zookeeper) -- the officially documented
    # minimal setup, per Kafka's own quickstart docs. Three env vars
    # aren't just performance tuning, they're load-bearing for this
    # package's own tests, confirmed live:
    #   - KAFKA_MESSAGE_MAX_BYTES / KAFKA_REPLICA_FETCH_MAX_BYTES: the
    #     broker's own default (~1MB) rejects this project's own
    #     large-payload conformance test outright.
    #   - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0: Kafka's own default
    #     (3000ms) deliberately delays a brand-new consumer group's
    #     first partition assignment to let other near-simultaneous
    #     joiners batch in -- fine in production, but adds 3s to every
    #     single fresh-namespace conformance sub-test here for no
    #     benefit (nothing else is racing to join the same group).
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MESSAGE_MAX_BYTES: 8388608
      KAFKA_REPLICA_FETCH_MAX_BYTES: 8388608
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    # No healthcheck: this image ships no shell utility suited to a
    # simple exec probe against the broker port. `docker compose up
    # --wait` falls back to waiting for "running" state, same as the
    # nats/pinecone services above -- Makefile's own test-kafka target
    # additionally waits for the port to actually accept connections
    # before running tests, since this image's own startup (JVM boot +
    # KRaft bootstrap) is slower than "container running" implies.

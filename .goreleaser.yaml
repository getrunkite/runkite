# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: runkite

before:
  hooks:
    - go mod tidy

builds:
  - id: runkite
    main: ./cmd/
    binary: runkite
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: getrunkite
    name: runkite
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./spec/openapi.json
    - glob: ./spec/openapi-admin.json
    - glob: ./spec/openapi-internal.json
  footer: |
    ## Install

    **Binary** — download an archive below, or:

    ```bash
    # example (linux amd64)
    curl -fsSL -o runkite.tgz \
      https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Linux_x86_64.tar.gz
    tar -xzf runkite.tgz && sudo mv runkite /usr/local/bin/
    ```

    **Docker**

    ```bash
    docker pull ghcr.io/getrunkite/runkite:{{.Version}}
    docker pull ghcr.io/getrunkite/runkite-runner:{{.Version}}
    ```

    **Python / npm runners**

    ```bash
    pip install runkite-runner=={{.Version}}
    npm install -g runkite-runner@{{.Version}}
    ```

    Site: https://getrunkite.github.io/runkite/  
    Limitations (release summary): https://github.com/getrunkite/runkite/blob/main/docs/limitations.md

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: runkite

before:
  hooks:
    - go mod tidy

builds:
  - id: runkite
    main: ./cmd/
    binary: runkite
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  # Install / download links live in release.header so they appear first.
  use: github
  sort: asc
  groups:
    - title: Changes
      order: 0
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"
      - Merge pull request
      - dependabot

release:
  github:
    owner: getrunkite
    name: runkite
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./spec/openapi.json
    - glob: ./spec/openapi-admin.json
    - glob: ./spec/openapi-internal.json
  # Shown ABOVE the auto changelog so Downloads are the first thing people see.
  # (GitHub still lists binary Assets in the Assets section below the notes.)
  header: |
    ## Downloads

    | Platform | Archive |
    |----------|---------|
    | macOS Apple Silicon | [runkite_{{.Version}}_Darwin_arm64.tar.gz](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Darwin_arm64.tar.gz) |
    | macOS Intel | [runkite_{{.Version}}_Darwin_x86_64.tar.gz](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Darwin_x86_64.tar.gz) |
    | Linux x86_64 | [runkite_{{.Version}}_Linux_x86_64.tar.gz](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Linux_x86_64.tar.gz) |
    | Linux arm64 | [runkite_{{.Version}}_Linux_arm64.tar.gz](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Linux_arm64.tar.gz) |
    | Checksums | [checksums.txt](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/checksums.txt) |
    | OpenAPI | [openapi.json](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/openapi.json) · [admin](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/openapi-admin.json) · [internal](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/openapi-internal.json) |

    ## Install

    ```bash
    # Binary (example: Linux x86_64)
    curl -fsSL -o runkite.tgz \
      https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Linux_x86_64.tar.gz
    tar -xzf runkite.tgz && sudo mv runkite /usr/local/bin/

    # Docker
    docker pull ghcr.io/getrunkite/runkite:{{.Version}}
    docker pull ghcr.io/getrunkite/runkite-runner:{{.Version}}

    # Runners
    pip install runkite-runner=={{.Version}}
    npm install -g runkite-runner@{{.Version}}
    ```

    Site: https://getrunkite.github.io/runkite/ · Limitations: https://github.com/getrunkite/runkite/blob/main/docs/limitations.md

    ---

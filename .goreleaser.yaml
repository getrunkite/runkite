# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: runkite

before:
  hooks:
    - go mod tidy

builds:
  - id: runkite
    main: ./cmd/
    binary: runkite
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildTime={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - NOTICE
      - README.md
      - src: admin-ui/public/licenses/*
        dst: licenses
        strip_parent: true
      - src: spec/third-party/*
        dst: licenses
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  # Install / download links live in release.header so they appear first.
  use: github
  sort: asc
  groups:
    - title: Changes
      order: 0
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"
      - Merge pull request
      - dependabot

release:
  github:
    owner: getrunkite
    name: runkite
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./spec/openapi.json
    - glob: ./spec/openapi-admin.json
    - glob: ./spec/openapi-internal.json
  # Shown above the auto changelog, including version-specific upgrade notices.
  # (GitHub still lists binary Assets in the Assets section below the notes.)
  header: |
    {{ if eq .Version "0.10.0" }}
    ## Coordinated upgrade required

    v0.10.0 changes the runner identity contract and SQL accounting schema.
    Stop submissions/cron dispatch, drain workers and queued assignments, stop
    all writers and verify database, queue and receipt backups before upgrading.
    Apply Postgres/SQLite migration 23 or MySQL migration 24, then deploy matching
    protocol-1 planes, runners and custom integrations before restoring traffic.
    Missing original-record proof has no compatibility fallback. Automatic
    downgrade is refused; rollback needs a reviewed backup and reconciliation.

    Preserve/reconcile legacy unbound accounting, bare terminal-hook claims and
    ambiguous same-ID receipts. Use fresh IDs for intentional new work. Managed
    connector operations need fresh policy evaluation/review; app-owned approvals
    already returned are not revoked and must be reconciled by their owner.
    Kafka requires explicit `RUNKITE_KAFKA_ALLOW_NONATOMIC_FENCES=true` to accept
    its weaker mode, even with Redis.

    Follow the [complete upgrade sequence](https://github.com/getrunkite/runkite/blob/v0.10.0/docs/internal/release-candidate-v0100.md#upgrade-sequence)
    and [operator runbook](https://github.com/getrunkite/runkite/blob/v0.10.0/docs/ops-runbook.md#assignment-identity-upgrade).

    {{ end }}
    ## Downloads

    | Platform | Archive |
    |----------|---------|
    | macOS Apple Silicon | [runkite_{{.Version}}_Darwin_arm64.tar.gz](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Darwin_arm64.tar.gz) |
    | macOS Intel | [runkite_{{.Version}}_Darwin_x86_64.tar.gz](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Darwin_x86_64.tar.gz) |
    | Linux x86_64 | [runkite_{{.Version}}_Linux_x86_64.tar.gz](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Linux_x86_64.tar.gz) |
    | Linux arm64 | [runkite_{{.Version}}_Linux_arm64.tar.gz](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Linux_arm64.tar.gz) |
    | Checksums | [checksums.txt](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/checksums.txt) |
    | OpenAPI | [openapi.json](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/openapi.json) · [admin](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/openapi-admin.json) · [internal](https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/openapi-internal.json) |

    ## Install

    ```bash
    # Binary (example: Linux x86_64)
    curl -fsSL -o runkite.tgz \
      https://github.com/getrunkite/runkite/releases/download/v{{.Version}}/runkite_{{.Version}}_Linux_x86_64.tar.gz
    tar -xzf runkite.tgz && sudo mv runkite /usr/local/bin/

    # Docker
    docker pull ghcr.io/getrunkite/runkite:{{.Version}}
    docker pull ghcr.io/getrunkite/runkite-runner:{{.Version}}

    # Runners
    pip install runkite-runner=={{.Version}}
    npm install -g runkite-runner@{{.Version}}
    ```

    Site: https://getrunkite.github.io/runkite/ · Limitations: https://github.com/getrunkite/runkite/blob/main/docs/limitations.md

    ---
